<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sprite Test Playground</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0c001f;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>

<body>
<canvas id="game"></canvas>

<script type="module">
import kaplay from "https://cdn.jsdelivr.net/npm/kaplay@3001.0.19/dist/kaplay.mjs";

/* ---------- PLAYER SHEETS ----------
   ONE SPRITE SHEET PER MOVEMENT, EACH A SINGLE ROW OF EQUAL-SIZE FRAMES
   (frames = HOW MANY IN THAT ROW). TO REWORK A MOVE, JUST REPLACE ITS PNG
   (AND UPDATE frames IF THE COUNT CHANGED) - NOTHING ELSE TO RE-COUNT.
   FRAMES ARE EXPECTED AT PLAYER_FRAME x PLAYER_FRAME (400x400). A SHEET WITH A
   DIFFERENT CELL SIZE STILL LOADS - IT'S SCALED TO FIT AND A CONSOLE WARNING
   IS LOGGED - BUT RESIZE IT WHEN YOU CAN. WHICH SHEETS PLAY WHICH ANIMATION
   (AND HOW FAST) IS IN PLAYER_ANIMS FURTHER DOWN. */
const PLAYER_FRAME = 400;
const PLAYER_SHEETS = {
  run:        { src: "assets/images/run.png",        frames: 8 },
  idle:       { src: "assets/images/idle.png",       frames: 6 }, // 6-FRAME BREATHING LOOP (NO CAPE DRAWN - IT'S ADDED IN CODE, SEE IDLE_CAPE)
  jump:       { src: "assets/images/jump.png",       frames: 5 }, // SEE JUMP_FRAME: 0 START (TRANSITION INTO THE JUMP), 1 RISE, 2 FLIP (TUCKED BALL, CAPE SMEARED INTO THE ART), 3 FALL, 4 LAND. 0 / 1 / 3 / 4 HAVE NO CAPE DRAWN (VERLET CAPE ADDED IN CODE, SEE JUMP_CAPE)
  wall_slide: { src: "assets/images/wall_slide.png", frames: 1 },
  attack:     { src: "assets/images/attack.png",     frames: 1 }, // spell cast - ONE 400x400 FRAME, NO CAPE DRAWN (VERLET CAPE ADDED IN CODE, SEE ATTACK_CAPE)
  kick:       { src: "assets/images/kick.png",       frames: 6 }, // melee kick - cape baked in
  airKick:    { src: "assets/images/airKick.png",    frames: 8 }, // MID-AIR KICK (X WHILE AIRBORNE, SEE AIR_KICK) - SMEAR FRAMES, CAPE BAKED IN. 0-3 WIND-UP, 4-6 FULLY EXTENDED KICK, 7 RECOIL
};
const RUN = { from: 0, to: 7 };   // FRAMES INSIDE THE RUN SHEET

/* ---------- JUMP SHEET FRAMES + TIMING ----------
   WHAT EACH FRAME OF jump.png IS. EACH ONE IS ITS OWN ANIMATION (SEE PLAYER_ANIMS):
     start - TRANSITION INTO THE JUMP: SHOWN FOR JUMP_START_TIME RIGHT AFTER LEAVING THE GROUND
     rise  - LAUNCH / ASCEND: HELD FOR AS LONG AS THE PLAYER IS GOING UP
     flip  - TUCKED BALL: THE DOUBLE JUMP (SEE DOUBLE_JUMP). ITS CAPE IS SMEARED INTO THE ART
     fall  - DESCENT: HELD FOR AS LONG AS THE PLAYER IS GOING DOWN (FALL_VEL_THRESHOLD BELOW)
     land  - TOUCHDOWN: SHOWN FOR JUMP_LAND_TIME AFTER A REAL FALL, THEN IDLE / RUN TAKES OVER */
const JUMP_FRAME = { start: 0, rise: 1, flip: 2, fall: 3, land: 4 };
const JUMP_START_TIME = 0.05;        // SECONDS THE START FRAME SHOWS (SUPER SHORT)
const JUMP_LAND_TIME = 0.07;         // SECONDS THE LAND FRAME SHOWS WHEN YOU TOUCH DOWN STANDING STILL (SUPER SHORT)
const JUMP_LAND_TIME_MOVING = 0.05;  // SAME, BUT WHEN YOU'RE HOLDING LEFT / RIGHT SO THE RUN PICKS UP QUICKER
const JUMP_LAND_MIN_IMPACT = 250;    // LANDING vel.y (px/s) NEEDED TO SHOW THE LAND FRAME - STOPS TINY STEP-DOWNS FLASHING IT

/* ---------- PER-SHEET SIZE / PLACEMENT TWEAKS ----------
   FOR WHEN A SHEET WAS DRAWN A BIT BIG/SMALL OR NOT QUITE SEATED IN ITS CELL, SO
   YOU DON'T HAVE TO REDRAW IT. EVERYTHING IS VISUAL ONLY - HITBOX/PHYSICS NEVER MOVE.
     scale    - SIZE MULTIPLIER FOR THAT SHEET (1 = AS DRAWN). SCALES AROUND THE FEET, SO
                THE CHARACTER GROWS/SHRINKS WITHOUT SLIDING OFF THE GROUND
     offsetX  - PX SHIFT FORWARD (+) / BACK (-) IN THE 400x400 CELL. MIRRORS WHEN FACING LEFT
     offsetY  - PX SHIFT DOWN (+) / UP (-). MANUAL FOOT NUDGE ON TOP OF snapFeet
     snapFeet - MEASURE EACH FRAME'S LOWEST VISIBLE PIXEL WHEN THE SHEET LOADS AND DROP THAT
                FRAME DOWN BY ITS GAP, SO THE FEET LAND FLUSH ON THE GROUND IN EVERY FRAME.
                ONLY FOR GROUNDED SHEETS - AIRBORNE FRAMES (JUMP / FALL / RUN) SHOULD KEEP THEIR GAP
     snapFrames - LIKE snapFeet BUT ONLY FOR THE LISTED FRAME NUMBERS (E.G. [4] = JUST THE JUMP SHEET'S LAND FRAME, THE
                ONE GROUNDED FRAME IN A SHEET OF AIRBORNE ONES)
   TUNE scale LIVE: PRESS [ AND ] TO SHRINK / GROW THE CURRENT SHEET BY 0.02 (READOUT SHOWS
   THE VALUE, CONSOLE LOGS IT) THEN COPY THE NUMBER HERE. */
const PLAYER_SHEET_TWEAKS = {
  idle: { scale: 1.0, offsetX: 0, offsetY: 0, snapFeet: true },
  jump: { scale: 1.0, offsetX: 0, offsetY: 0, snapFeet: false, snapFrames: [JUMP_FRAME.land] }, // ONLY THE LAND FRAME IS ON THE GROUND (ITS FEET SIT ~14px ABOVE THE CELL BOTTOM)
};
const FOOT_ALPHA_MIN = 24; // A PIXEL COUNTS AS "FOOT" ONCE ITS ALPHA (0-255) PASSES THIS - IGNORES FAINT ANTI-ALIAS FRINGE

/* ---------- WALL SLIDE VISUAL OFFSET ----------
   UNLIKE THE OTHER FRAMES, THE WALL SLIDE FRAME'S ART ISN'T CENTERED IN ITS CELL -
   THE CHARACTER (FACING RIGHT, AS DRAWN) SITS TOWARD THE LEFT EDGE, WITH THE
   GRABBING HAND/FOOT RIGHT AT THE CELL'S LEFT EDGE. kaplay's anchor("bot")
   CENTERS ON THE CELL, NOT THE VISIBLE PIXELS, AND flipX MIRRORS AROUND THAT
   SAME CELL-CENTER - SO WITHOUT CORRECTION THE CHARACTER VISUALLY STRADDLES
   THE WALL INSTEAD OF HUGGING ONE FACE OF IT.
   THIS SHIFTS THE DRAWN SPRITE (VISUAL ONLY - HITBOX/PHYSICS NEVER MOVE, SAME
   TRICK AS visualLift) BY THIS MANY PIXELS WHILE WALL-SLIDING, TO RE-CENTER
   THE RAW (FACING-RIGHT) ART ON THE ANCHOR. TO MEASURE IT EXACTLY: OPEN
   wall_slide.png AND COMPUTE
   (CELL_WIDTH / 2) - (X OF THE CHARACTER'S VISUAL CENTERLINE WITHIN THE CELL).
   IF THE SIGN LOOKS BACKWARDS (CHARACTER SHIFTS THE WRONG WAY) NEGATE IT. */
const WALL_SLIDE_VISUAL_OFFSET_X = 150; // px - TUNE ME against a wall with F1 debug open

/* ---------- AIR ANIMATION ----------
   PICK RISING ("jump") OR DESCENT ("fall") BASED ON vel.y. */
const FALL_VEL_THRESHOLD = 30; // vel.y (px/s, down = +) above which rising -> falling

/* ---------- RUN CYCLE FEEL ----------
   KAPLAY ANIMS SUPPORT ONE FPS ONLY, SO THE RUN CYCLE IS STEPPED BY HAND
   (SEE updateRun). EACH POSE HAS:
     hold - FRAME DURATION MULTIPLIER (1.0 = normal, <1 = quicker, >1 = lingers)
     lift - PX THE SPRITE IS DRAWN ABOVE THE GROUND (VISUAL ONLY - HITBOX/PHYSICS NEVER MOVE)
   TUNE THESE LIVE: THEY'RE THE WHOLE FEEL OF THE RUN. */
const RUN_BASE_FPS = 11; // same as the old run speed
const POSES = {
  contact: { hold: 1.0, lift: 3 },
  passing: { hold: 0.7, lift: 0 }, // fastest, flush with the ground
  takeoff: { hold: 1.0, lift: 3 },
  up:      { hold: 1.6, lift: 7 }, // longest, highest
};
// WHAT EACH OF THE 8 RUN FRAMES IS, IN ORDER (RUN SHEET FRAMES RUN.from..RUN.to)
const RUN_POSE_ORDER = [
  "contact", "passing", "takeoff", "up",
  "contact", "passing", "takeoff", "up",
];
const RUN_CYCLE = RUN_POSE_ORDER.map((pose, i) => ({
  frame: RUN.from + i,
  hold: POSES[pose].hold / RUN_BASE_FPS,
  lift: POSES[pose].lift,
}));

/* ---------- CLOAK OVERLAY CONFIG ----------
   attack, attackKick AND airKick HAVE THE CAPE BAKED INTO THEIR SHEETS, SO THE OVERLAY
   SKIPS THEM. idle AND wallSlide HAVE NO CAPE AT ALL YET (LEFT AS-IS FOR NOW) -
   THEY SKIP THE OVERLAY TOO. SO IT ONLY COVERS run (SEE CAPE_BAKED_ANIMS).
   (idle NOW HAS A CAPE TOO, BUT A VERLET ONE - SEE IDLE_CAPE - NOT THIS OVERLAY. SAME FOR THE
   JUMP SHEET'S FRAMES - SEE JUMP_CAPE - SO THE jump / fall ENTRIES IN CLOAK_POSE BELOW ARE NOW UNUSED.)
   TWO LAYERS - cloakBack (BEHIND BODY) AND cloakFront (IN FRONT OF
   BODY/ARM) - SANDWICH THE PLAYER SPRITE. BOTH PLAY THE SAME 4-FRAME
   "WIND" LOOP DRIVEN BY OUR OWN TIMER (NOT KAPLAY'S ANIM SYSTEM).

   TUNE EVERYTHING BELOW LIVE: CHANGE A NUMBER, SAVE, RELOAD. x/y ARE LOCAL
   OFFSETS IN THE 400x400 PLAYER FRAME SPACE (0,0 = FEET, NEGATIVE y = UP
   TOWARD HEAD). rot IS DEGREES, POSITIVE = CLOCKWISE, FOR FACING RIGHT -
   MIRRORED AUTOMATICALLY WHEN FACING LEFT (SEE cloakLayer()). CLOAK_ANCHOR
   IS THE POINT ON THE 300x300 CLOAK ART PINNED TO (x,y); STRING LIKE
   "topright" OR A Vec2 WITH EACH AXIS FROM -1 (left/top) TO 1 (right/bottom). */
const CLOAK_BACK_SRC = "assets/images/cloakBottom.png";
const CLOAK_FRONT_SRC = "assets/images/cloakTop.png";
const CLOAK_FRAME_COUNT = 4;
const CLOAK_FPS = 5;               // wind-loop speed - independent of body pose/frame
const CLOAK_ANCHOR = { x: 0.6, y: 0.7 }; // where on cloak art the attach point sits
const CLOAK_SCALE = 0.95;             // uniform scale on both cloak layers

const CLOAK_POSE = {
  run:    { x: 150, y: -35, rot: 0 },
  jump:   { x: 120, y: -40, rot: -20 }, // UNUSED - THE JUMP FRAMES' CAPE IS THE VERLET ONE (SEE JUMP_CAPE)
  fall:   { x: 120, y: -40, rot: 30 },  // UNUSED - SAME
  attack: { x: 100, y: -10, rot: 0 }, // UNUSED - THE ATTACK'S CAPE IS THE VERLET ONE (SEE ATTACK_CAPE)
};

// ANIMS THE SPRITE CLOAK OVERLAY (cloakBack / cloakFront) SKIPS: EITHER THE CAPE IS BAKED
// INTO THE SHEET, OR NONE IS DRAWN. idle IS HERE ON PURPOSE: ITS CAPE IS THE VERLET ONE
// (SEE IDLE_CAPE) IN EVERY CAPE MODE, NOT THE 4-FRAME WIND-LOOP ART. THE JUMP SHEET'S FRAMES ARE HERE
// FOR THE SAME REASON (VERLET CAPE - SEE JUMP_CAPE - EXCEPT doubleJump, WHICH HAS ITS CAPE DRAWN IN).
const CAPE_BAKED_ANIMS = new Set(["idle", "attack", "attackKick", "airKick", "wallSlide", "jumpStart", "jump", "doubleJump", "fall", "land"]);
// ANIMS THE VERLET CAPE DOESN'T DRAW OVER (idle AND attack AREN'T LISTED - THAT'S THE POINT OF
// IDLE_CAPE / ATTACK_CAPE: THEY GET THE VERLET CAPE IN EVERY CAPE MODE). doubleJump IS THE FLIP FRAME AND
// airKick THE AIR KICK'S SMEAR FRAMES - BOTH HAVE THEIR CAPE SMEARED INTO THE ART.
const CAPE_VERLET_SKIP_ANIMS = new Set(["attackKick", "airKick", "wallSlide", "doubleJump"]);

// DRAWS A DOT AT EACH CLOAK'S ATTACH POINT - HELPS WHILE DIALING IN
// CLOAK_POSE x/y ABOVE.
const CLOAK_DEBUG_MARKERS = false;

/* ---------- CAPE PHYSICS ----------
   PRESS V TO CYCLE THE THREE CAPE MODES LIVE (NAME SHOWN IN THE DEBUG READOUT):
     0  sprites        - YOUR HAND-DRAWN 4-FRAME CLOAK, EXACTLY AS BEFORE
     1  spring + warp  - SAME ART, TWO TRICKS ON TOP:
                         (a) A DAMPED SPRING SWINGS THE WHOLE CLOAK BACK WITH SPEED AND
                             GETS KICKED ON JUMP / LAND / DASH, SO IT OVERSHOOTS + SETTLES
                         (b) THE ART IS SLICED INTO VERTICAL STRIPS THAT RIPPLE WITH A
                             TRAVELING WAVE, SO THE FLAT DRAWING UNDULATES LIKE CLOTH
     2  verlet cloth   - NO ART: A CHAIN OF POINTS SIMULATED WITH VERLET INTEGRATION
                         (GRAVITY + AIR DRAG + DISTANCE CONSTRAINTS), DRAWN AS A TAPERED
                         NEON RIBBON BEHIND THE BODY. REPLACES THE CLOAK OVERLAY
   THE CAPE BAKED INTO THE kick SHEET STAYS AS DRAWN IN EVERY MODE (wall slide HAS NO CAPE
   YET) - A FULL REPLACEMENT NEEDS THOSE BODY FRAMES REDRAWN WITHOUT THE CAPE. idle AND
   attack ALREADY HAVE CAPE-FREE ART, SO THEY ALWAYS GET THE VERLET CAPE (IDLE_CAPE / ATTACK_CAPE).
   EVERY NUMBER BELOW IS SAFE TO TWEAK LIVE. */
const CAPE_MODES = ["sprites (original)", "spring + warp", "verlet cloth"];
const CAPE_START_MODE = 2; // DEFAULT = VERLET CLOTH (WITH THE GHOST-TAIL DISSOLVE, SEE CAPE_DISSOLVE). 0 / 1 = THE SPRITE CLOAK MODES

/* ---- mode 1: SPRING + WAVE WARP ---- */
const CAPE_SPRING_STIFFNESS = 100;   // pull toward the target swing angle (higher = snappier)
const CAPE_SPRING_DAMPING = 80;       // friction (critical damping would be 2*sqrt(stiffness) = ~23; lower = more wobble)
const CAPE_SPRING_RUN_ANGLE = 0;    // degrees the cloak swings at full run speed. SIGN DEPENDS ON YOUR ART: + raises the tail of a cape that streams up-and-back, - lowers it; flip it if it swings the wrong way
const CAPE_SPRING_FALL_ANGLE = 12;   // extra degrees when falling fast (negative while rising)
const CAPE_SPRING_KICK = 260;        // deg/s impulse on jump / landing / dash (the overshoot)
const CAPE_WARP_STRIPS = 50;         // vertical slices of the art (more = smoother ripple + fewer stair-steps on diagonal edges)
const CAPE_WARP_AMP = [6, 24];       // ripple height in art px at the tip: [standing, full speed]
const CAPE_WARP_FREQ = [1, 3];   // ripple speed in Hz: [standing, full speed]
const CAPE_WARP_PHASE = 5.0;         // radians of wave across the cloak's length (more = more S-curves)

/* ---- mode 2: VERLET CLOTH (ribbon) ---- */
const CAPE_CLOTH = {
  segments: 12,       // points in the chain
  segLen: 9,         // px between points (cape length = (segments-1) * segLen)
  gravity: 1500,      // px/s^2
  drag: 5.6,          // per-second velocity loss = air resistance. THE "streams out behind you" knob
  lift: 0.2,         // 0..1: how much gravity is cancelled at full run speed (1 = cape flies perfectly flat)
  flutter: 400,      // px/s^2 turbulence at the tip while moving
  backBias: 5000,      // px/s^2 gentle push toward the back of the body, so the cape never flips over your front mid-air
  iterations: 6,      // constraint passes per step (more = less stretchy)
  bend: 0.5,         // 0..1: resists sharp folds (higher = stiffer, stays straighter)
  step: 1 / 120,      // fixed physics step (s) - keeps the sim stable at any framerate
  maxSteps: 6,        // cap steps per frame so a lag spike can't spiral
  w0: 10, w1: 55,     // ribbon width at the collar / at the hem (px)
  ripple: 0.4,       // 0..1 width wobble along the hem
  rootOffset: { x: -110, y: -180 }, // WHERE THE CAPE HANGS FROM, RELATIVE TO CLOAK_POSE's x/y (art px, + = forward / down). The sprite cloak's pivot sits at the FRONT collar; this moves it back to the nape. TURN ON CLOAK_DEBUG_MARKERS TO SEE IT (cyan dot)
};
const CAPE_COLORS = ["#0000ff", "#0000ff", "#0000ff"]; // collar -> middle -> hem
const CAPE_EDGE = "#0000ff";
const CAPE_EDGE_GLOW = "#0000ff";

/* ---- CAPE DISSOLVE ("GHOST TAIL") - PORTED FROM capeLab.html ----
   THE SAME NOISE-THRESHOLD SHADER AS THE SPAWN DISSOLVE, RUN ALONG THE VERLET CAPE: NOTHING IS
   EATEN NEAR THE COLLAR, THE HEM BREAKS UP INTO A GLOWING BURN EDGE AND FADES OUT. THE NOISE IS PINNED
   TO THE CLOTH (NOT THE SCREEN) AND DRIFTS TOWARD THE HEM, SO THE BURN FRONT LICKS OFF THE TAIL.
   APPLIES TO EVERY POSE THE VERLET CAPE IS DRAWN IN (idle / run / jump / fall) AND TO BOTH IDLE LAYERS.
   PRESS G TO TOGGLE LIVE. EVERY NUMBER IS SAFE TO TWEAK LIVE. capeLab.html's VALUES ARE FOR A CAPE ~2x
   LONGER THAN THIS ONE, SO THE LENGTH-BASED ONES (cell, flow) ARE HALVED-ish HERE. */
const CAPE_DISSOLVE = {
  enabled: true,
  start: 0.8,   // WHERE ALONG THE CAPE THE DISSOLVE BEGINS (0 = COLLAR, 1 = HEM)
  amount: 0.7,   // HOW GONE THE HEM GETS (1 = COMPLETELY)
  cell: 9,       // NOISE BLOB SIZE, PX ALONG THE CAPE (BIGGER = CHUNKIER HOLES)
  edge: 0.1,    // GLOWING BURN BAND WIDTH (0..1 OF THE NOISE RANGE)
  flow: 30,      // PX/S THE NOISE DRIFTS TOWARD THE HEM (NEGATIVE = TOWARD THE COLLAR)
  speed: 0.5,    // FASTER MOVEMENT = DISSOLVE CREEPS UP THE CAPE (0 = ALWAYS STARTS AT `start`)
  fade: 0.9,     // EXTRA ALPHA FADE AT THE HEM (0..1)
  glow: 0.2,     // BRIGHTNESS BOOST OF THE BURN EDGE
  edgeFade: 0.25, // THE STROKED RIM / FOLD LINES FADE OUT OVER THIS MUCH CAPE LENGTH AFTER `start`, SO THEY DON'T OUTLINE THE HOLES
};

/* ---- IDLE CAPE: VERLET CAPE IN THE IDLE ANIMATION ----
   THE IDLE SHEET HAS NO CAPE DRAWN, SO WHILE STANDING STILL THE SAME VERLET CHAIN AS MODE 2
   IS HUNG FROM THE NAPE AND DRAWN BEHIND THE BODY - IN EVERY CAPE MODE (V), NOT JUST MODE 2.
   IT EASES IN/OUT OF THE RUN-STYLE PHYSICS OVER ~1/blendRate SECONDS, SO STARTING OR STOPPING
   A RUN DOESN'T SNAP THE CHAIN.
   TWO LAYERS: A DARK LINING SHEET SITS BEHIND, SHIFTED TOWARD THE BACK EDGE, AND THE MAIN
   CAPE SITS NARROWER ON TOP, SO THE LINING PEEKS OUT. ONE SIMULATED CHAIN DRAWN TWICE.
   EVERY NUMBER IS SAFE TO TWEAK LIVE. */
const IDLE_CAPE = {
  enabled: true,
  root: { x: 30, y: -222 },   // ATTACH POINT AT THE BACK OF THE SHOULDERS, IN IDLE ART PX (0,0 = FEET CENTER OF THE CELL, -y = UP, + x = FORWARD). SCALES WITH PLAYER_SHEET_TWEAKS.idle
  rootBob: [0, -2, -6, -7, -7, -5], // PX THE SHOULDERS RISE PER IDLE FRAME (MEASURED FROM THE HEAD'S TOP EDGE), SO THE CAPE RIDES THE BREATHING
  blendRate: 6,               // HOW FAST THE PHYSICS EASES BETWEEN RUN-STYLE AND IDLE-STYLE (PER SECOND)
  backBias: 150,              // px/s^2 STEADY LEAN TOWARD THE BACK (RUN-STYLE IS 2000 - FAR TOO STRONG FOR STANDING)
  gust: 850,                  // px/s^2 EXTRA PUSH AT THE PEAK OF A GUST
  gustHz: 0.35,               // GUSTS PER SECOND
  flutter: 150,               // px/s^2 TURBULENCE AT THE HEM WHILE STANDING (THE RUN VERSION SCALES WITH SPEED, WHICH IS ~0 HERE)
  layered: true,              // false = SINGLE SHEET
  topWidth: 0.84,             // WIDTH OF THE TOP SHEET (1 = FULL RIBBON WIDTH)
  liningShift: 0.12,          // HOW FAR THE LINING SLIDES TOWARD THE BACK EDGE (FRACTION OF RIBBON WIDTH)
  liningColors: ["#37025a", "#830cde", "#00ffff"], // collar -> middle -> hem
  liningEdge: "#A55AFF",
  liningGlow: "#830cde",
};

/* ---- ATTACK CAPE: VERLET CAPE + WIND GUST ON THE SPELL CAST ----
   attack.png IS A SINGLE FRAME WITH NO CAPE DRAWN, SO THE SAME VERLET CHAIN IS HUNG FROM THE NAPE
   WHILE THE CAST POSE IS UP (IN EVERY CAPE MODE, LIKE IDLE_CAPE), WITH THE SAME TWO-LAYER LOOK.
   THE MOMENT THE SPELL IS CAST A GUST OF WIND BLOWS THE CAPE BACK (AND LIFTS IT A LITTLE): IT SWELLS
   QUICKLY, PEAKS EARLY, THEN EASES OFF OVER gustTime. EVERY NUMBER IS SAFE TO TWEAK LIVE.
   TO PLACE THE CAPE: SET CLOAK_DEBUG_MARKERS TO true - THE CYAN DOT IS THE ATTACH POINT. */
const ATTACK_CAPE = {
  enabled: true,
  root: { x: 0, y: -185 },   // ATTACH POINT AT THE BACK OF THE SHOULDERS, IN ATTACK ART PX (0,0 = FEET CENTER OF THE CELL, -y = UP, + x = FORWARD). SCALES WITH PLAYER_SHEET_TWEAKS.attack
  blendRate: 20,             // HOW FAST THE PHYSICS / ATTACH POINT EASE INTO THE ATTACK POSE (PER SECOND)
  backBias: 600,             // px/s^2 STEADY LEAN TOWARD THE BACK WHILE CASTING
  flutter: 250,              // px/s^2 TURBULENCE AT THE HEM DURING THE CAST
  gust: 7000,                // px/s^2 PEAK BACKWARD PUSH OF THE CAST GUST
  gustLift: 0.7,             // 0..1: FRACTION OF GRAVITY CANCELLED AT THE GUST'S PEAK (THE CAPE FLIES UP AND BACK)
  gustTime: 0.6,             // SECONDS THE GUST LASTS (ATTACK_HOLD_TIME IS 0.35, SO IT SETTLES A LITTLE AFTER THE POSE ENDS)
};

/* ---- JUMP CAPE: VERLET CAPE ON THE JUMP SHEET'S FRAMES ----
   jump.png FRAMES 0 / 1 / 3 / 4 (start / rise / fall / land) HAVE NO CAPE DRAWN, SO THE SAME VERLET CHAIN IS HUNG
   FROM THE NAPE WHILE THEY'RE UP, IN EVERY CAPE MODE (LIKE IDLE_CAPE / ATTACK_CAPE). THE FLIP (FRAME 2) HAS ITS CAPE
   SMEARED INTO THE ART, SO IT GETS NONE. EVERY NUMBER IS SAFE TO TWEAK LIVE.
   roots - ATTACH POINT PER POSE, IN JUMP ART PX (0,0 = FEET CENTER OF THE CELL, -y = UP, +x = FORWARD). MEASURED BY EYE
           OFF THE ART - NUDGE THEM IF THE CAPE LOOKS LIKE IT'S HANGING FROM THE WRONG SPOT. SCALES WITH PLAYER_SHEET_TWEAKS.jump.
   TO PLACE: SET CLOAK_DEBUG_MARKERS TO true - THE CYAN DOT IS THE ATTACH POINT. */
const JUMP_CAPE = {
  roots: {
    jumpStart: { x: 14, y: -205 },
    jump:      { x: 8,  y: -215 },
    fall:      { x: 20, y: -244 },
    land:      { x: 26, y: -238 },
  },
  blendRate: 16,   // HOW FAST THE ATTACH POINT EASES IN FROM / OUT TO THE OTHER POSES (PER SECOND)
  rootEase: 30,    // HOW FAST IT SLIDES BETWEEN THE JUMP POSES (PER SECOND), SO THE CHAIN ISN'T YANKED AT EVERY FRAME SWAP
};

/* ---------- DOUBLE JUMP ----------
   ONE EXTRA JUMP PER AIRTIME (REFILLED ON LANDING OR WALL CONTACT, SAME AS THE AIR DASH). IT PLAYS JUMP FRAME 2
   (THE TUCKED BALL) AND SPINS THAT ONE FRAME: THE ROTATION EASES OUT, AND `turns` IS A WHOLE NUMBER SO IT ENDS UPRIGHT
   AND HANDS BACK TO THE RISE / FALL FRAME WITHOUT A POP.
   WHILE IT SPINS, TWO THINGS SPIRAL OUT OF THE CHARACTER (THE EMISSION ANGLE RIDES THE SPIN, SO THEY TRACE SPIRAL ARMS):
     ghosts - AFTERIMAGES OF THE BALL, ALTERNATING FLAT NEON SILHOUETTES (LIKE THE DASH TRAIL) AND DISSOLVING COPIES
              (SAME NOISE SHADER AS THE SPAWN DISSOLVE) THAT DRIFT OUTWARD, KEEP SPINNING, BLOOM AND BURN AWAY
     motes  - THE SAME GLOWING MOTES AS THE RUN / AIR TRAIL, SHOT OUT IN `arms` SPIRAL ARMS, PLUS A SWIRLING RING AT LAUNCH
   EVERY NUMBER IS SAFE TO TWEAK LIVE. enabled: false TURNS THE WHOLE THING OFF (THE EXTRA JUMP TOO). */
const DOUBLE_JUMP = {
  enabled: true,
  force: 900,            // UPWARD KICK (JUMP_FORCE IS 1000)
  spinTime: 0.45,        // SECONDS THE FLIP SPINS BEFORE HANDING BACK TO RISE / FALL
  turns: 2,              // WHOLE ROTATIONS OVER spinTime (KEEP IT A WHOLE NUMBER SO IT ENDS UPRIGHT)
  pivotY: 207,           // ART PX ABOVE THE FEET THAT THE BALL SPINS AROUND (THE BALL'S CENTER IN FRAME 2)
  squash: { x: 0.9, y: 1.12 }, // LAUNCH POP (MILDER THAN SQUASH_JUMP SO THE BALL STAYS ROUNDISH). NO SPEED STRETCH WHILE IT SPINS EITHER
  // ---- SPIRAL GHOSTS ----
  ghostInterval: 0.02,   // SECONDS BETWEEN AFTERIMAGES
  ghostLife: 0.5,        // SECONDS EACH ONE LIVES
  ghostAlpha: 0.6,       // STARTING OPACITY
  ghostSpeed: 230,       // PX/S OUTWARD (ALONG THE BALL'S CURRENT SPIN ANGLE)
  ghostDrag: 2.2,        // PER-SECOND SLOWDOWN OF THAT DRIFT
  ghostInherit: 0.5,     // FRACTION OF THE PLAYER'S vel.y THE GHOSTS START WITH, SO THE SPIRAL STAYS CLOSE TO YOU INSTEAD OF TRAILING STRAIGHT DOWN

// "SCALE TRICK": KAPLAY'S LOGICAL RESOLUTION IS WHAT GAME OBJECTS LIVE IN.
// `scale` RENDERS THAT LOGICAL CANVAS AT N× PIXEL DENSITY, THEN THE BROWSER
// STRETCHES/LETTERBOXES IT BACK DOWN. EXTRA DENSITY KEEPS SPRITE EDGES CRISP.
const SCREEN_W = window.innerWidth;
const SCREEN_H = window.innerHeight;
const scale = 2;

const k = kaplay({
  width: (SCREEN_W / 2) * scale,
  height: (SCREEN_H / 2) * scale,
  scale,
  letterbox: true,
  stretch: true,
  global: false,
  canvas: document.getElementById("game"),
  background: [3, 0, 19],
  crisp: true,
  debug: true,
  pixelDensity: window.devicePixelRatio,
});

            "| DPR:", window.devicePixelRatio);
k.setGravity(1800);

const MAX_FALL_SPEED = 1500; // PREVENTS TUNNELING THROUGH THIN PLATFORMS

/* ---------- ONE-WAY PLATFORMS ----------
   SOLID ONLY WHEN LANDING FROM ABOVE. SIDES AND UNDERSIDE IGNORED, SO YOU
   CAN JUMP UP THROUGH AND LAND ON TOP. ADD oneWay() TO ANY STATIC BODY,
   AFTER area() AND body().

   RULE: BLOCK PLAYER ONLY IF
     1) NOT MOVING UPWARD (vel.y >= 0), AND
     2) FEET WERE AT/ABOVE PLATFORM'S TOP EDGE ONE PHYSICS STEP AGO.
   OTHERWISE CALL preventResolution() AND PASS THROUGH.
   (KAPLAY'S BUILT-IN platformEffector IN 3001.0.19 CHECKS VELOCITY ANGLE
   INSTEAD, WHICH LETS FALLING OBJECTS THROUGH - SO THIS IS HAND-ROLLED.) */
const ONE_WAY_TOLERANCE = 4; // px of forgiveness when judging "was player above?"

function oneWay() {
  return {
    id: "oneWay",
    require: ["area", "body"],
    add() {
      // IN THIS HANDLER `col.target` IS ALWAYS THE OTHER OBJECT (THE PLAYER).
      this.onBeforePhysicsResolve((col) => {
        const other = col.target;
        if (!other.has("body") || other.isStatic) return;

        const platTop = this.worldArea().bbox().pos.y;
        const hb = other.worldArea().bbox();
        const feetNow = hb.pos.y + hb.height;
        const feetPrev = feetNow - other.vel.y * k.fixedDt();

        const landingFromAbove =
          other.vel.y >= 0 && feetPrev <= platTop + ONE_WAY_TOLERANCE;

        if (!landingFromAbove) col.preventResolution();
      });
    },
  };
}

/* ---------- CAMERA FOLLOW ---------- */
const CAM_Y_OFFSET = 120;   // keeps ground from sitting glued to bottom edge
const CAM_LERP_SPEED = 6;   // higher = snappier follow, lower = floatier

// screen shake state - shakeCamera() STARTS IT, updateCamera() FADES + APPLIES IT.
// KEPT SEPARATE FROM camPos ITSELF SO THE SHAKE NEVER FIGHTS THE FOLLOW LERP -
// IT'S ADDED ON TOP OF THE LERPED POSITION EACH FRAME INSTEAD.
let shakeDuration = 0; // total length of the current shake, for fading strength to 0
let shakeTimer = 0;    // seconds of shake remaining
let shakeStrength = 0; // max px offset at full strength

function shakeCamera(duration, strength) {
  shakeDuration = duration;
  shakeTimer = duration;
  shakeStrength = strength;
}

function updateCamera() {
  if (!player) return;
  const target = k.vec2(player.pos.x, player.pos.y - CAM_Y_OFFSET);
  const cur = k.camPos();
  let next = cur.lerp(target, Math.min(1, k.dt() * CAM_LERP_SPEED));

  if (shakeTimer > 0) {
    shakeTimer -= k.dt();
    const fade = Math.max(0, shakeTimer / shakeDuration); // 1 -> 0 over the shake's life
    const mag = shakeStrength * fade;
    next = next.add(k.vec2(rnd(-mag, mag), rnd(-mag, mag)));
  }

  k.camPos(next);
}

let wallJumpPushDir = 1;  // direction (away from wall) the lock pushes while active

// starter-pack effect state
const squash = { x: 1, y: 1, vx: 0, vy: 0 }; // spring-driven scale multipliers (see updateSquash)
let dashTimer = 0;          // seconds of dash remaining (0 = not dashing)
let dashCooldown = 0;       // seconds until another dash is allowed
let dashDir = 1;            // +1 right / -1 left, locked in when the dash starts
let airDashReady = true;    // one dash per airtime; refilled on landing / wall contact
let airJumpReady = true;    // one double jump per airtime; refilled on landing / wall contact (SEE DOUBLE_JUMP)
let airKickReady = true;    // one air kick per airtime (WHEN AIR_KICK.oncePerAirtime); refilled on landing
const airKick = { t: 0, dir: 1, hit: false }; // t = SECONDS LEFT (0 = NOT KICKING), dir = LUNGE DIRECTION LOCKED AT THE START, hit = IMPACT FRAME ALREADY FIRED
let jumpStartTimer = 0;     // seconds the jump sheet's START frame is still showing after takeoff (SEE JUMP_START_TIME)
let landTimer = 0;          // seconds the LAND frame is still showing after touching down (SEE JUMP_LAND_TIME)
let wasAirborne = false;    // LAST FRAME'S !grounded, SO THE MAIN LOOP CAN SPOT THE MOMENT OF TOUCHDOWN
let airPeakFall = 0;        // FASTEST FREE-FALL vel.y THIS AIRTIME = HOW HARD THE LANDING IS (JUMP_LAND_MIN_IMPACT)
// DOUBLE JUMP FLIP STATE: t = SECONDS OF SPIN LEFT (0 = NOT FLIPPING), angle = DEGREES SPUN SO FAR (UNSIGNED), dir = SPIN DIRECTION
// LOCKED AT TAKEOFF, angVel = DEG/S, THE REST ARE EMISSION ACCUMULATORS
const doubleJump = { t: 0, angle: 0, angVel: 0, dir: 1, ghostAcc: 0, moteAcc: 0, ghostN: 0 };
let ghostAcc = 0;           // accumulator for afterimage spawning

/* SQUASH/STRETCH HELPER COMPS: SCALE EVERYTHING DRAWN BETWEEN THEM AROUND THE
   FEET (THE OBJECT'S pos). squashBegin GOES FIRST IN THE COMPONENT LIST,
   squashEnd LAST, SO THE CLOAK AND LIFT/OFFSET TRICKS SQUASH WITH THE BODY. */
function squashBegin() {
  return {
    id: "squashBegin",
    draw() {
      k.pushTransform();
      k.pushScale(squash.x, squash.y);
    },
  };
}
function squashEnd() {
  return {
    id: "squashEnd",
    draw() {
      k.popTransform();
    },
  };
}

/* TINY HELPER COMPS: DRAW SPRITE SHIFTED UP BY visualLift WITHOUT TOUCHING
   pos/hitbox. liftBegin GOES BEFORE sprite(), liftEnd AFTER IT. */
function liftBegin() {
  return {
    id: "liftBegin",
    draw() {
      k.pushTransform();
      k.pushTranslate(0, -visualLift);
    },
  };
}
function liftEnd() {
  return {
    id: "liftEnd",
    draw() {
      k.popTransform();
    },
  };
}

/* SAME TRICK AS liftBegin/liftEnd BUT SIDEWAYS - SHIFTS THE DRAWN SPRITE BY
   wallSlideHOffset WITHOUT TOUCHING pos/hitbox. hOffsetBegin GOES BEFORE
   sprite(), hOffsetEnd AFTER IT. */
function hOffsetBegin() {
  return {
    id: "hOffsetBegin",
    draw() {
      k.pushTransform();
      k.pushTranslate(wallSlideHOffset, 0);
    },
  };
}
function hOffsetEnd() {
  return {
    id: "hOffsetEnd",
    draw() {
      k.popTransform();
    },
  };
}

// cloak wind-loop state - one shared timer drives both layers so they never drift out of sync.
let cloakFrame = 0;
let cloakTimer = 0;

function updateCloakAnim(dt) {
  cloakTimer += dt;
  const frameTime = 1 / CLOAK_FPS;
  while (cloakTimer >= frameTime) {
    cloakTimer -= frameTime;
    cloakFrame = (cloakFrame + 1) % CLOAK_FRAME_COUNT;
  }
}

// MIRRORS LEFT/RIGHT PART OF A KAPLAY ANCHOR PRESET ("topleft" <-> "topright");
// PRESETS WITH NO LEFT/RIGHT COMPONENT ("top", "center", "bot") PASS THROUGH UNCHANGED.
function mirrorAnchorPreset(preset, facingLeft) {
  if (!facingLeft) return preset;
  if (preset.includes("left")) return preset.replace("left", "right");
  if (preset.includes("right")) return preset.replace("right", "left");
  return preset;
}

function cloakLayer(which) { /* which: "cloakBack" or "cloakFront" - PICKS LOADED SPRITE AND, FOR DEBUG MARKER, A COLOR TO TELL THE TWO APART AT A GLANCE. */
  return {
    id: which,
    draw() {  // SEE CAPE_BAKED_ANIMS: THOSE SHEETS EITHER HAVE THE CAPE DRAWN IN OR NONE YET
      if (CAPE_BAKED_ANIMS.has(currentAnim)) return;
      if (capeMode === 2) return; // VERLET CLOTH DRAWS THE CAPE INSTEAD (drawCloth)
      const pose = CLOAK_POSE[currentAnim] ?? CLOAK_POSE.run;
      const facingLeft = this.flipX;
      const dir = facingLeft ? -1 : 1;
      const pos = k.vec2(pose.x * dir, pose.y);
      // KAPLAY'S STRING PRESETS ("topright", ETC.) WORK AS-IS, BUT A PLAIN
      // {x,y} OBJECT NEEDS TO BE A REAL Vec2 (NEEDS .scale() INTERNALLY) -
      // k.vec2() WASN'T CONSTRUCTED YET WHERE CLOAK_ANCHOR IS DEFINED UP TOP,
      // SO CONVERT IT HERE INSTEAD.
      // flipX ONLY MIRRORS DRAWN PIXELS - THE ANCHOR IS A PURELY GEOMETRIC
      // "HOW FAR ACROSS THE QUAD" SETTING THAT DOESN'T KNOW ABOUT flipX, SO
      // WITHOUT THIS THE PIVOT STAYS GLUED TO THE SAME SIDE OF THE QUAD WHILE
      // THE ART FLIPS UNDERNEATH IT. MIRRORING THE LEFT/RIGHT COMPONENT HERE
      // KEEPS THE PIVOT ON THE SAME VISUAL FEATURE (E.G. THE COLLAR) IN BOTH DIRECTIONS.
      const anchor = typeof CLOAK_ANCHOR === "string"
        ? mirrorAnchorPreset(CLOAK_ANCHOR, facingLeft)
        : k.vec2(facingLeft ? -CLOAK_ANCHOR.x : CLOAK_ANCHOR.x, CLOAK_ANCHOR.y);

      // MODE 1: SAME ART, SPRING-SWUNG AND STRIP-WARPED. FALLS BACK TO THE PLAIN DRAW BELOW
      // IF IT CAN'T RUN (STRING ANCHOR PRESET, SPRITE NOT READY).
      const warped = capeMode === 1 && drawCloakWarped(which, cloakFrame, pos, pose.rot, dir);
      if (!warped) k.drawSprite({
        sprite: which,
        frame: cloakFrame,
        pos,
        anchor,
        angle: pose.rot * dir,
        scale: CLOAK_SCALE,
        flipX: facingLeft,
        // DISSOLVE THE CAPE WITH THE BODY (SAME SHADER, ITS OWN SHEET'S FRAME RECT)
        ...(FX.dissolve && dissolveAmount > 0
          ? { shader: "dissolve", uniform: dissolveUniform(which, cloakFrame) }
          : {}),
      });

      if (CLOAK_DEBUG_MARKERS) {
        k.drawCircle({
          pos,
          radius: 4,
          color: which === "cloakBack" ? k.rgb("#ff00ff") : k.rgb("#00ffff"),
        });
      }
    },
  };
}

/* ---------- PLAYER SPRITE ----------
   EACH SHEET IN PLAYER_SHEETS IS ITS OWN KAPLAY SPRITE ("player_run", "player_kick", ...).
   kaplay's sprite() COMP CAN'T SWAP SHEETS ON A LIVE OBJECT WITHOUT SCRAMBLING THE
   squashBegin/liftBegin/cloak DRAW ORDER, SO THE PLAYER USES THE playerSprite() COMP
   BELOW INSTEAD: IT KEEPS THE SAME .frame / .flipX / .play() SURFACE, BUT ALSO TRACKS
   WHICH SHEET IS CURRENT AND DRAWS IT IN THE SAME SLOT. */
const sheetSprite = (key) => `player_${key}`;
const sheetScales = {}; // key -> SCALE-TO-FIT FACTOR (1 WHEN THE SHEET IS ALREADY PLAYER_FRAME TALL)
const sheetScale = (key) => sheetScales[key] ?? 1;
const footGaps = {}; // key -> PER-FRAME PX BETWEEN THE LOWEST VISIBLE PIXEL AND THE CELL'S BOTTOM EDGE (ONLY FOR snapFeet SHEETS)

// THE TWEAK ENTRY FOR A SHEET (CREATED ON DEMAND SO [ ] CAN SCALE ANY SHEET LIVE)
function sheetTweak(key) {
  return (PLAYER_SHEET_TWEAKS[key] ??= { scale: 1, offsetX: 0, offsetY: 0, snapFeet: false });
}

/* HOW ONE FRAME OF A SHEET IS DRAWN: s = FINAL SCALE (SCALE-TO-FIT x TWEAK), ox / oy = LOCAL-SPACE
   PX SHIFT (FORWARD-MIRRORED / DOWN). SHARED BY THE PLAYER AND THE DASH GHOSTS SO THEY AGREE. */
function sheetPlace(key, frame, flip) {
  const tw = sheetTweak(key);
  const s = sheetScale(key) * tw.scale;
  const snap = tw.snapFeet || tw.snapFrames?.includes(frame); // WHOLE SHEET, OR JUST THE LISTED FRAMES
  const gap = snap ? (footGaps[key]?.[frame] ?? 0) : 0; // GAP IS IN SHEET PX, SO IT SCALES WITH THE ART
  return { s, ox: (flip ? -1 : 1) * tw.offsetX, oy: gap * s + tw.offsetY };
}

// SCANS A SHEET'S PIXELS ONCE AT LOAD: PER FRAME, HOW MANY PX THE LOWEST VISIBLE PIXEL SITS ABOVE THE
// CELL'S BOTTOM EDGE. (NEEDS THE PAGE SERVED OVER http - SAME AS THE REST OF THE GAME. FAILS SOFT.)
function measureFootGaps(key, sheet) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      try {
        const cw = Math.floor(img.width / sheet.frames);
        const ch = img.height;
        const cv = document.createElement("canvas");
        cv.width = img.width;
        cv.height = ch;
        const cx = cv.getContext("2d", { willReadFrequently: true });
        cx.drawImage(img, 0, 0);
        const px = cx.getImageData(0, 0, img.width, ch).data;
        const gaps = [];
        for (let f = 0; f < sheet.frames; f++) {
          let bottom = -1;
          for (let y = ch - 1; y >= 0 && bottom < 0; y--) {
            for (let x = f * cw; x < (f + 1) * cw; x++) {
              if (px[(y * img.width + x) * 4 + 3] > FOOT_ALPHA_MIN) { bottom = y; break; }
            }
          }
          gaps.push(bottom < 0 ? 0 : ch - 1 - bottom);
        }
        footGaps[key] = gaps;
        console.log(`[player sheets] ${key}: foot gaps per frame (px above cell bottom):`, gaps.join(", "));
      } catch (e) {
        console.warn(`[player sheets] ${key}: couldn't measure foot gaps (${e.message}) - snapFeet skipped, use offsetY instead.`);
      }
      resolve();
    };
    img.onerror = () => resolve();
    img.src = sheet.src;
  });
}

async function loadPlayerSprites() {
  for (const [key, sheet] of Object.entries(PLAYER_SHEETS)) {
    await k.loadSprite(sheetSprite(key), sheet.src, { sliceX: sheet.frames, sliceY: 1 });
    if (sheetTweak(key).snapFeet || sheetTweak(key).snapFrames?.length) await measureFootGaps(key, sheet);
    const data = k.getSprite(sheetSprite(key))?.data;
    if (!data) continue;
    // EVERY SHEET IS DRAWN AT THE SAME ON-SCREEN SIZE AS A 400x400 CELL, SO AN OVERSIZED
    // (OR UNDERSIZED) SHEET STILL LOOKS RIGHT UNTIL IT'S RESIZED
    sheetScales[key] = PLAYER_FRAME / data.height;
    if (data.width !== PLAYER_FRAME || data.height !== PLAYER_FRAME) {
      console.warn(`[player sheets] ${key}: frames are ${data.width}x${data.height}, expected ${PLAYER_FRAME}x${PLAYER_FRAME} - scaled x${sheetScales[key].toFixed(2)} to fit. Resize ${sheet.src} when you can.`);
    }
  }
}

function playerSprite() {
  return {
    id: "playerSprite",
    // FIXED AT THE EXPECTED CELL SIZE (NOT THE CURRENT SHEET'S): kaplay's area() POSITIONS THE
    // HITBOX FROM THESE, SO THEY MUST NOT CHANGE FROM ONE ANIMATION TO THE NEXT. spawnSpell()
    // READS THEM TOO.
    width: PLAYER_FRAME,
    height: PLAYER_FRAME,
    sheet: "idle",      // KEY INTO PLAYER_SHEETS
    frame: 0,           // FRAME WITHIN THAT SHEET
    flipX: false,
    spin: 0,            // DEGREES THE BODY IS ROTATED ABOUT THE BALL'S CENTER (SIGNED, + = CLOCKWISE). ONLY THE DOUBLE JUMP'S FLIP SETS IT - SEE updateDoubleJump()
    anim: PLAYER_ANIMS.idle,
    animT: 0,
    play(name) { // START A PLAYER_ANIMS ENTRY: SWITCHES SHEET AND RESTARTS AT ITS FIRST FRAME
      const def = PLAYER_ANIMS[name];
      if (!def) return;
      this.anim = def;
      this.sheet = def.sheet;
      this.frame = def.from;
      this.animT = 0;
    },
    update() {
      const a = this.anim;
      if (!a || a.manual || a.to === a.from) return;
      const n = a.to - a.from + 1;
      if (a.holds) { // PER-FRAME TIMING: THE duration IS SPLIT BY THE holds WEIGHTS (HOLDS LAST FRAME AT THE END)
        this.animT += k.dt();
        let w = (this.animT / a.duration) * a.holds.reduce((s, h) => s + h, 0);
        let i = 0;
        while (i < n - 1 && w >= a.holds[i]) { w -= a.holds[i]; i++; }
        this.frame = a.from + i;
        return;
      }
      const fps = a.fps ?? n / a.duration;
      this.animT += k.dt();
      let i = Math.floor(this.animT * fps);
      i = a.loop ? i % n : Math.min(i, n - 1);
      this.frame = a.from + i;
    },
    draw() {
      const name = sheetSprite(this.sheet);
      const pl = sheetPlace(this.sheet, this.frame, this.flipX); // SIZE TWEAK + FOOT SNAP (SEE PLAYER_SHEET_TWEAKS)
      if (this.spin) { // ROTATE ABOUT THE BALL'S CENTER (IN THIS OBJECT'S LOCAL SPACE: x FROM THE FEET, y UP = NEGATIVE)
        const cy = pl.oy - DOUBLE_JUMP.pivotY * pl.s;
        k.pushTransform();
        k.pushTranslate(pl.ox, cy);
        k.pushRotate(this.spin);
        k.pushTranslate(-pl.ox, -cy);
      }
      k.drawSprite({
        sprite: name,
        frame: this.frame,
        pos: k.vec2(pl.ox, pl.oy),
        anchor: "bot",
        scale: pl.s,
        flipX: this.flipX,
        // DISSOLVE ONLY WHILE IT'S ACTUALLY RUNNING (AT dissolveAmount 0 THE SHADER IS A NO-OP ANYWAY)
        ...(FX.dissolve && dissolveAmount > 0
          ? { shader: "dissolve", uniform: dissolveUniform(name, this.frame) }
          : {}),
      });
      if (this.spin) k.popTransform();
    },
  };
}
