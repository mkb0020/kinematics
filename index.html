function makeRng(seed) { // TINY SEEDED PRNG (MULBERRY32) - STABLE "RANDOM" TILE PATTERN BETWEEN RELOADS
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildLevel() { /* COLLISION OBJECTS ARE INVISIBLE (NO rect() COMP, JUST EXPLICIT AREA SHAPE). ART IS ATTACHED AS CHILD SPRITES, SO IT MOVES WITH ITS COLLIDER. PRESS F1 TO SEE HITBOXES WHILE TUNING. */
  const ground = k.add([ // ground: invisible collider + ground.png repeated along it
    k.pos(0, GROUND_Y),
    k.area({ shape: new k.Rect(k.vec2(0, 0), GROUND_W, GROUND_H) }),
    k.body({ isStatic: true }),
    k.z(1),
  ]);
  const groundCols = Math.ceil(GROUND_W / GROUND_TILE_W);
  for (let i = 0; i < groundCols; i++) {
    ground.add([k.sprite("ground"), k.pos(i * GROUND_TILE_W, 0)]);
  }

const plats = [
  { x: 700, y: 300, w: 200 },
  { x: 500, y: 110, w: 160 },
  { x: 550, y: 0, w: 200 },
  { x: 3000, y: 300, w: 160 },
  { x: 4000, y: 330, w: 240 },
  { x: 5000, y: 260, w: 160 },
  { x: 6000, y: 300, w: 240 },
  { x: 7000, y: 380, w: 160 },
  { x: 8000, y: 240, w: 200 },
  { x: 9000, y: 300, w: 240 },
  { x: 11000, y: 300, w: 280 },
];

  const rand = makeRng(TILE_SEED);
  let prevFrame = -1;
  const pickMid = () => {
    let f;
    do {
      f = TILE_FRAMES[Math.floor(rand() * TILE_FRAMES.length)];
    } while (f === prevFrame && TILE_FRAMES.length > 1); // no back-to-back repeats
    prevFrame = f;
    return f;
  };

  plats.forEach((pd) => {
    const platform = k.add([
      k.pos(pd.x, pd.y),
      k.area({ shape: new k.Rect(k.vec2(0, 0), pd.w, PLATFORM_H) }),
      k.body({ isStatic: true }),
      oneWay(),
      k.z(1),
    ]);

    const cols = Math.ceil(pd.w / TILE_SIZE);
    for (let i = 0; i < cols; i++) {
      let frame;
      if (i === 0 && TILE_LEFT_CAP !== null) frame = TILE_LEFT_CAP;
      else if (i === cols - 1 && TILE_RIGHT_CAP !== null) frame = TILE_RIGHT_CAP;
      else frame = pickMid();
      platform.add([k.sprite("tiles", { frame }), k.pos(i * TILE_SIZE, 0)]);
    }
  });
}

function buildWalls() { // VERTICAL WALL COLLIDERS FOR WALL-SLIDING/JUMPING. TAGGED "wall" SO COLLIDE HANDLERS BELOW (touchingWall / onCollideUpdate) FIND THEM WITHOUT CARING ABOUT GROUND/PLATFORMS
  const rand = makeRng(COLUMN_SEED);
  WALLS.forEach((w) => {
    // INVISIBLE COLLIDER (SHAFT WIDTH) - THE ART IS ATTACHED AS CHILD SPRITES, LIKE THE PLATFORMS
    const wall = k.add([
      k.pos(w.x, GROUND_Y - w.h),
      k.area({ shape: new k.Rect(k.vec2(0, 0), WALL_W, w.h) }),
      k.body({ isStatic: true }),
      k.z(2),
      "wall",
    ]);

    const artX = -COLUMN_SHAFT_INSET; // CAP / BASE ARE WIDER THAN THE SHAFT, SO SHIFT THE ART LEFT TO CENTER IT ON THE COLLIDER
    const midH = Math.max(0, w.h - COLUMN_FRAME * 2);
    const pieces = Math.max(1, Math.ceil(midH / COLUMN_FRAME));
    const pieceH = midH / pieces; // EVEN SPLIT: SHAFT PIECES STRETCH SLIGHTLY INSTEAD OF CROPPING THE LAST ONE

    // SHAFT FIRST (DRAWN UNDER THE CAP / BASE)
    if (midH > 0) {
      for (let i = 0; i < pieces; i++) {
        const frame = rand() < COLUMN_RUNE_CHANCE
          ? COLUMN_RUNES[Math.floor(rand() * COLUMN_RUNES.length)]
          : COLUMN_PLAIN;
        wall.add([
          k.sprite("column", { frame }),
          k.pos(artX, COLUMN_FRAME + i * pieceH),
          k.scale(1, pieceH / COLUMN_FRAME),
        ]);
      }
    }
    wall.add([k.sprite("column", { frame: COLUMN_TOP }), k.pos(artX, 0)]);
    wall.add([k.sprite("column", { frame: COLUMN_BASE }), k.pos(artX, w.h - COLUMN_FRAME)]);
  });
}

function spawnPlayer(x = 100, y = GROUND_Y) {
  if (player) k.destroy(player);
  currentAnim = "idle";
  isAttacking = false;
  visualLift = 0;
  touchingWall = null;
  wallJumpLock = 0;
  resetParticleState();
  resetEffectState();
  // CUSTOM HITBOX, DEFINED INLINE ALONGSIDE body() (NOT VIA .use() AFTERWARD)
  // SO GROUNDED TRACKING STAYS CORRECTLY WIRED. TUNE LIVE WITH F1 OPEN:
  // HB_W/HB_H ARE BOX SIZE, HB_OFFSET_X/Y SHIFT IT FROM THE FEET.
  const HB_W = 70;
  const HB_H = 130;
  const HB_OFFSET_X = (-1) * HB_W; // INCREASE TO LIFT BOX OFF THE FEET IF IT DIPS BELOW GROUND
  const HB_OFFSET_Y = (-1) * HB_H;

  player = k.add([
    squashBegin(),
    liftBegin(),
    hOffsetBegin(),
    cloakLayer("cloakBack"),
    playerSprite(), // BODY - DRAWS THE CURRENT SHEET'S FRAME (DISSOLVE SHADER IS APPLIED INSIDE IT)
    cloakLayer("cloakFront"),
    hOffsetEnd(),
    liftEnd(),
    squashEnd(),
    k.pos(x, y),
    k.anchor("bot"),
    k.area({ shape: new k.Rect(k.vec2(-HB_W - HB_OFFSET_X, -HB_H - HB_OFFSET_Y), HB_W, HB_H) }),
    k.body(),
    k.scale(SCALE),
    k.z(10),
    "player",
  ]);

  spawnOneShotFX("spawnFx", x, y, { scale: SPAWN_FX_SCALE, z: SPAWN_FX_Z });
  startSpawnDissolve();

  return player;
}

function startRun() {
  runIdx = 0;
  runTimer = 0;
  player.play("run"); // SWITCHES TO THE RUN SHEET; "run" IS manual, SO updateRun() OWNS THE FRAME FROM HERE
  player.frame = RUN_CYCLE[0].frame;
  visualLift = RUN_CYCLE[0].lift;
}

function updateRun() {
  runTimer += k.dt(); // WHILE-LOOP SO A LONG FRAME (LAG SPIKE) CAN'T DRIFT THE CYCLE
  while (runTimer >= RUN_CYCLE[runIdx].hold) {
    runTimer -= RUN_CYCLE[runIdx].hold;
    runIdx = (runIdx + 1) % RUN_CYCLE.length;
  }
  player.frame = RUN_CYCLE[runIdx].frame;
  visualLift = RUN_CYCLE[runIdx].lift;
}

function playAnim(name) {
  if (!player || currentAnim === name) return;
  currentAnim = name;
  if (name === "run") {
    startRun();
    return;
  }
  visualLift = 0;
  player.play(name);
}

function spawnSpell() {
  if (!player) return;

  const facingLeft = player.flipX;
  const dir = facingLeft ? -1 : 1;
  const halfWidth = (player.width * player.scale.x) / 2;  // PLAYER'S RENDERED WIDTH/HEIGHT COME FROM CURRENT FRAME * SCALE
  const fullHeight = player.height * player.scale.y;
  const handX = player.pos.x + dir * (halfWidth + SPELL_FORWARD_OFFSET); // ANCHOR IS "bot", SO pos.y IS FEET; HAND SITS ~1/3 DOWN FROM TOP OF FRAME
  const handY = player.pos.y - fullHeight * (1 - HAND_HEIGHT_RATIO);

  const spell = k.add([
    k.sprite("spell", { anim: "cast" }),
    k.pos(handX, handY),
    k.anchor("center"),
    k.scale(SPELL_SCALE * dir, SPELL_SCALE),
    k.z(9),
  ]);

  spell.onAnimEnd(() => k.destroy(spell));

  // TRACK LIVE SPELLS SO updateLighting() CAN GIVE EACH ONE A GLOW
  activeSpells.push(spell);
  spell.onDestroy(() => {
    const i = activeSpells.indexOf(spell);
    if (i !== -1) activeSpells.splice(i, 1);
  });
}

function playAttack() {
  if (!player || isAttacking) return;
  isAttacking = true;
  dashTimer = 0; // ATTACKING CANCELS A DASH IN PROGRESS
  currentAnim = "attack";
  visualLift = 0;
  player.play("attack");
  spawnSpell();
  gustCape(); // WIND BLOWS THE CAPE BACK (SEE ATTACK_CAPE)

  k.wait(ATTACK_HOLD_TIME, () => {
    isAttacking = false;
  });
}

// SAME CELL SIZE AS THE PLAYER FRAME, SO IT'S DRAWN WITH player's OWN
// pos/anchor/scale (JUST MIRRORED THE SAME WAY VIA dir) AND LINES UP OVER
// THE KICK POSE WITHOUT ANY PER-EFFECT OFFSET TUNING.
function spawnKickSwoosh() {
  if (!player) return;
  const dir = player.flipX ? -1 : 1;
  const swoosh = k.add([
    k.sprite("swoosh", { anim: "play" }),
    k.pos(player.pos.x + 20 * dir, player.pos.y + 20),
    k.anchor("bot"),
    k.scale(SCALE * dir * 1.3, SCALE * 1.3),
    k.z(SWOOSH_Z),
  ]);
  swoosh.onAnimEnd(() => k.destroy(swoosh));
}

function playKickAttack() {
  if (!player || isAttacking) return;
  isAttacking = true;
  dashTimer = 0; // ATTACKING CANCELS A DASH IN PROGRESS
  currentAnim = "attackKick";
  visualLift = 0;
  player.play("attackKick"); // melee - no spell spawn
  spawnKickSwoosh();
  shakeCamera(KICK_SHAKE_DURATION, KICK_SHAKE_STRENGTH);
  hitStop(HITSTOP_KICK); // THE KICK HAS NO ENEMY TO HIT YET, SO IT STANDS IN FOR "THE HIT CONNECTED"

  k.wait(ATTACK_KICK_HOLD_TIME, () => {
    isAttacking = false;
  });
}

// X: ON THE GROUND = THE KICK, IN THE AIR = THE AIR KICK (SEE AIR_KICK). WITH AIR_KICK.enabled OFF IT'S THE OLD BEHAVIOUR (GROUND KICK EVERYWHERE)
function pressKick() {
  if (!player || isAttacking) return;
  if (player.isGrounded() || !AIR_KICK.enabled) {
    playKickAttack();
    return;
  }
  if (AIR_KICK.oncePerAirtime && !airKickReady) return; // ALREADY USED THIS JUMP
  playAirKick();
}

function playAirKick() {
  const A = AIR_KICK;
  isAttacking = true;
  airKickReady = false;
  dashTimer = 0;                 // ATTACKING CANCELS A DASH IN PROGRESS
  jumpStartTimer = 0;
  landTimer = 0;
  wallSlideHOffset = 0;          // KICKING OFF A WALL SLIDE SHOULDN'T KEEP ITS SIDEWAYS ART NUDGE
  currentAnim = "airKick";       // (ALSO CUTS A DOUBLE JUMP'S SPIN SHORT - updateDoubleJump SEES THE ANIM CHANGE)
  visualLift = 0;
  player.play("airKick");
  airKick.t = A.holdTime;
  airKick.dir = player.flipX ? -1 : 1;
  airKick.hit = false;
  player.vel.y *= A.vyKeep;      // KILL MOST OF THE VERTICAL SPEED, UP OR DOWN
  player.gravityScale = A.gravityScale;
  kickSquash(A.squash.x, A.squash.y);
}

// RUNS IN THE ALWAYS-ON LOOP (THE MAIN ONE IS SKIPPED WHILE isAttacking): LUNGE, IMPACT-FRAME FX, AND ENDING THE KICK
function updateAirKick(dt) {
  const A = AIR_KICK;
  if (airKick.t <= 0) return;
  const end = () => {
    airKick.t = 0;
    isAttacking = false;
    if (player) player.gravityScale = 1;
  };
  if (!player || currentAnim !== "airKick") { // RESPAWNED / SOMETHING ELSE TOOK OVER
    airKick.t = 0;
    if (player) player.gravityScale = 1;
    return;
  }
  if (player.isGrounded()) { // TOUCHED DOWN MID-KICK: THE AIR SMEAR WOULD LOOK WRONG ON THE GROUND, SO STOP
    end();
    return;
  }
  if (dt <= 0) return; // HIT-STOP FREEZE
  const u = 1 - airKick.t / A.holdTime; // 0 -> 1 OVER THE KICK
  player.move(airKick.dir * A.lunge * (1 - u * u), 0);
  if (!airKick.hit && player.frame >= A.impactFrame) {
    airKick.hit = true;
    shakeCamera(A.shakeTime, A.shakeStrength);
    hitStop(A.hitStop);
  }
  airKick.t -= dt;
  if (airKick.t <= 0) end();
}

/* ---------- WALL CONTACT TRACKING ----------
   touchingWall IS KEPT UP TO DATE BY THESE TWO COLLIDE HANDLERS RATHER THAN
   COMPUTED INLINE IN THE MAIN UPDATE LOOP, SINCE onCollideUpdate ONLY FIRES
   WHILE THE SHAPES OVERLAP (onCollideEnd CLEARS IT THE INSTANT THEY SEPARATE) -
   A PLAIN DISTANCE/OVERLAP CHECK IN onUpdate WOULD DUPLICATE THAT SAME TEST BY HAND.

   SIDE IS WORKED OUT FROM RESOLVED HITBOXES (worldArea().bbox(), SAME TRICK
   oneWay() USES) RATHER THAN player.pos.x DIRECTLY. THE PLAYER'S HITBOX ISN'T
   CENTERED ON THAT ANCHOR POINT, SO COMPARING RAW POSITIONS COULD CALL THE
   WRONG SIDE AT THE MOMENT OF CONTACT (CHARACTER WOULD SLIDE FACING AWAY FROM
   THE WALL IT'S ACTUALLY TOUCHING) - bbox() GIVES THE TRUE BOX, SO ITS CENTER
   IS RELIABLE REGARDLESS OF HITBOX OFFSET. */
k.onCollideUpdate("player", "wall", (p, w) => {
  const pCenterX = p.worldArea().bbox().pos.x + p.worldArea().bbox().width / 2;
  const wCenterX = w.worldArea().bbox().pos.x + w.worldArea().bbox().width / 2;
  touchingWall = { dir: pCenterX < wCenterX ? 1 : -1 };
});
k.onCollideEnd("player", "wall", () => {
  touchingWall = null;
});

k.onUpdate(() => {
  if (!player) return;

  if (isAttacking) { // HOLD ATTACK POSE; MOVEMENT/ANIM RESUMES ONCE IT ENDS
    wasAirborne = false; airPeakFall = 0; jumpStartTimer = 0; landTimer = 0; // A LANDING DURING AN ATTACK SHOULDN'T PLAY THE JUMP FRAMES ONCE IT ENDS
    return;
  }

  let moving = false;

  if (dashCooldown > 0) dashCooldown -= k.dt();

  if (dashTimer > 0) { // DASH: FIXED-SPEED BURST IN THE LOCKED DIRECTION, OVERRIDING NORMAL INPUT
    dashTimer -= k.dt();
    player.move(dashDir * DASH_SPEED, 0);
    player.flipX = dashDir === -1;
    if (!player.isGrounded()) player.vel.y = 0; // AIR DASH HOVERS FLAT INSTEAD OF DROPPING
    moving = true;
  } else if (wallJumpLock > 0) {// OVERRIDE NORMAL INPUT MOMENTARILY SO WALL-JUMP PUSH CLEARS THE WALL INSTEAD OF BEING CANCELLED BY A STILL-HELD DIRECTION KEY.
    wallJumpLock -= k.dt();
    player.move(wallJumpPushDir * WALL_JUMP_PUSH, 0);
    player.flipX = wallJumpPushDir === -1;
    moving = true;
  } else {
    if (k.isKeyDown("left") || k.isKeyDown("a")) {
      player.move(-MOVE_SPEED, 0);
      player.flipX = true;
      moving = true;
    }
    if (k.isKeyDown("right") || k.isKeyDown("d")) {
      player.move(MOVE_SPEED, 0);
      player.flipX = false;
      moving = true;
    }
  }

  if (player.vel.y > MAX_FALL_SPEED) player.vel.y = MAX_FALL_SPEED;

  const grounded = player.isGrounded();
  if (grounded || touchingWall) { // REFILL THE ONE-PER-AIRTIME DASH + DOUBLE JUMP
    airDashReady = true;
    airJumpReady = true;
  }
  if (grounded) airKickReady = true; // THE AIR KICK ONLY REFILLS ON THE GROUND (NOT WALLS), SO IT CAN'T BE CHAINED ALONG A WALL TO HOVER

  // WALL-SLIDE ONLY ENGAGES AIRBORNE, MID-LOCK-FREE, TOUCHING A WALL,
  // AND HOLDING THE DIRECTION KEY PRESSING INTO IT (CLASSIC CLING - LET
  // GO OF THE KEY AND YOU FALL INSTEAD OF STICKING).
  let wallSliding = false;
  if (!grounded && wallJumpLock <= 0 && touchingWall && player.vel.y >= 0) {
    const pressingLeft = k.isKeyDown("left") || k.isKeyDown("a");
    const pressingRight = k.isKeyDown("right") || k.isKeyDown("d");
    const pressingIntoWall =
      (touchingWall.dir === 1 && pressingRight) ||
      (touchingWall.dir === -1 && pressingLeft);
    wallSliding = pressingIntoWall;
  }

  // TOUCHDOWN: A REAL FALL (NOT A TINY STEP-DOWN, NOT A SLOW WALL SLIDE) SHOWS THE LAND FRAME BRIEFLY (SEE JUMP_LAND_TIME)
  if (grounded) {
    if (wasAirborne && airPeakFall >= JUMP_LAND_MIN_IMPACT) landTimer = moving ? JUMP_LAND_TIME_MOVING : JUMP_LAND_TIME;
    airPeakFall = 0;
  } else if (wallSliding) {
    airPeakFall = 0;
  } else {
    airPeakFall = Math.max(airPeakFall, player.vel.y);
  }
  wasAirborne = !grounded;

  if (wallSliding) {
    if (player.vel.y > WALL_SLIDE_SPEED) player.vel.y = WALL_SLIDE_SPEED;
    player.flipX = touchingWall.dir === 1; // FACE AWAY FROM THE WALL SO IT'S BEHIND YOU (dir 1 = wall is to the right, so flip to face left)
    // THE WALL SLIDE ART IS OFF-CENTER (SEE WALL_SLIDE_VISUAL_OFFSET_X UP
    // TOP), SO flipX ALONE LEAVES THE VISIBLE CHARACTER STRADDLING THE WALL.
    // NUDGE THE DRAWN SPRITE BACK ONTO THE CORRECT FACE OF IT: RAW/UNFLIPPED
    // ART (touching wall on its left) SHIFTS RIGHT TO RE-CENTER; MIRRORED
    // ART (touching wall on its right) SHIFTS LEFT BY THE SAME AMOUNT.
    wallSlideHOffset = player.flipX ? -WALL_SLIDE_VISUAL_OFFSET_X : WALL_SLIDE_VISUAL_OFFSET_X;
    playAnim("wallSlide");
  } else if (!grounded) {
    wallSlideHOffset = 0;
    landTimer = 0;
    // DOUBLE JUMP FLIP > FALLING > START FRAME (BRIEF, RIGHT AFTER TAKEOFF) > RISING
    if (doubleJump.t > 0) playAnim("doubleJump");
    else if (player.vel.y > FALL_VEL_THRESHOLD) playAnim("fall");
    else playAnim(jumpStartTimer > 0 ? "jumpStart" : "jump");
    if (jumpStartTimer > 0) jumpStartTimer -= k.dt(); // AFTER PICKING THE FRAME, SO EVEN A LONG FRAME (LAG SPIKE) STILL SHOWS IT ONCE
  } else if (landTimer > 0) {
    wallSlideHOffset = 0;
    landTimer -= k.dt();
    playAnim("land");
  } else if (moving) {
    wallSlideHOffset = 0;
    playAnim("run");
  } else {
    wallSlideHOffset = 0;
    playAnim("idle");
  }
  if (currentAnim === "run") updateRun();

  const LEVEL_MIN_X = 0;
  const LEVEL_MAX_X = 13500; 
  if (player.pos.x < LEVEL_MIN_X) player.pos.x = LEVEL_MIN_X;
  if (player.pos.x > LEVEL_MAX_X) player.pos.x = LEVEL_MAX_X;
  if (player.pos.y > GROUND_Y + 300) spawnPlayer();

  // (updateCamera() NOW RUNS IN THE ALWAYS-ON LOOP FURTHER DOWN. IT USED TO LIVE HERE,
  // BUT THE isAttacking EARLY-RETURN ABOVE SKIPPED IT, SO THE KICK SHAKE DIDN'T START
  // UNTIL THE KICK ENDED - EXACTLY WRONG FOR HIT-STOP.)
});

k.onKeyPress(["up", "w", "space"], () => {
  if (!player || isAttacking) return;
  if (player.isGrounded()) {
    player.jump(JUMP_FORCE);
    jumpStartTimer = JUMP_START_TIME; // BRIEFLY SHOW THE "TRANSITION INTO THE JUMP" FRAME, THEN THE RISE FRAME TAKES OVER
    landTimer = 0;
    kickSquash(SQUASH_JUMP.x, SQUASH_JUMP.y);
    kickCape(-1);
  } else if (touchingWall) {
    // LAUNCH POSE -> WALL SLIDE POSE -> LAUNCH POSE: THIS KICKS OFF THAT
    // LAST LEG BY PUSHING UP AND AWAY FROM THE WALL WE WERE JUST CLINGING TO.
    wallJumpPushDir = touchingWall.dir * -1; // away from the wall
    player.vel.y = -WALL_JUMP_FORCE;
    wallJumpLock = WALL_JUMP_LOCK_TIME;
    touchingWall = null; // RELEASE CLING SO SLIDE LOGIC DOESN'T INSTANTLY RECLAIM IT
    player.flipX = wallJumpPushDir === -1;
    jumpStartTimer = JUMP_START_TIME;
    playAnim("jumpStart");
    kickSquash(SQUASH_JUMP.x, SQUASH_JUMP.y);
    kickCape(-1);
  } else if (DOUBLE_JUMP.enabled && airJumpReady) {
    startDoubleJump();
  }
});

k.onKeyPress(DASH_KEYS, () => {
  tryDash();
});

k.onKeyPress("z", () => {
  playAttack();
});

k.onKeyPress("x", () => {
  pressKick();
});

k.onKeyPress("r", () => {
  dissolveOutAndRespawn();
});

k.onKeyPress("v", () => { // CYCLE CAPE MODE: sprites -> spring + warp -> verlet cloth
  capeMode = (capeMode + 1) % CAPE_MODES.length;
  if (capeMode === 2) cloth.need = true; // RE-HANG THE CHAIN FROM THE COLLAR
});

// [ AND ] SHRINK / GROW WHICHEVER SHEET IS ON SCREEN (SEE PLAYER_SHEET_TWEAKS). FOR DIALING IN SIZE
// BY EYE - COPY THE LOGGED NUMBER INTO THE CONFIG SO IT SURVIVES A RELOAD.
function nudgeSheetScale(delta) {
  if (!player) return;
  const tw = sheetTweak(player.sheet);
  tw.scale = Math.max(0.2, Math.round((tw.scale + delta) * 100) / 100);
  console.log(`[tweak] ${player.sheet} scale = ${tw.scale}  ->  PLAYER_SHEET_TWEAKS.${player.sheet}.scale`);
}
k.onKeyPress("g", () => { // TOGGLE THE CAPE'S GHOST-TAIL DISSOLVE (SEE CAPE_DISSOLVE) TO A/B IT
  CAPE_DISSOLVE.enabled = !CAPE_DISSOLVE.enabled;
});
k.onKeyPress("[", () => nudgeSheetScale(-0.02));
k.onKeyPress("]", () => nudgeSheetScale(0.02));

k.onKeyPress("l", () => {
  lightingOn = !lightingOn;
  if (lightOverlay) lightOverlay.hidden = !lightingOn;
});

/* ---------- PARTICLES ----------
   HAND-ROLLED ON PURPOSE: EVERY PARTICLE IS JUST AN ENTRY IN ONE ARRAY,
   STEPPED IN A SINGLE onUpdate AND DRAWN BY ONE GAME OBJECT, SO HUNDREDS
   OF MOTES COST ALMOST NOTHING (NO PER-PARTICLE GAME OBJECTS).

   EMISSION RULES
     running   - WHILE GROUNDED AND MOVING SIDEWAYS: MOTES SPAWN JUST BEHIND
                 THE FEET AND DRIFT UP/BACK WHILE SHRINKING AND FADING
     airborne  - AFTER AIR_TRAIL_DELAY IN THE AIR: MOTES SPAWN ALONG THE
                 BODY, SO A JUMP LEAVES A SHIMMERING WAKE
     landing   - THE FRAME YOU TOUCH DOWN AFTER FALLING FASTER THAN
                 PUFF_MIN_IMPACT: NOT PART OF THIS ARRAY - SEE
                 spawnLandingPuff() AND spawnOneShotFX(), WHICH PLAY THE
                 puff.png SPRITE INSTEAD */
const particles = [];
const TRAIL_RGB = TRAIL_COLORS.map((c) => k.rgb(c));
const DJ_MOTE_RGB = DOUBLE_JUMP.moteColors.map((c) => k.rgb(c));
const rnd = (a, b) => a + Math.random() * (b - a);

let pWasGrounded = true;
let pLastX = null;
let pAirTime = 0;
let pPeakFall = 0;   // FASTEST DOWNWARD SPEED THIS JUMP = LANDING IMPACT
let pRunAcc = 0;
let pAirAcc = 0;

function resetParticleState() {
  pWasGrounded = true;
  pLastX = null;
  pAirTime = 0;
  pPeakFall = 0;
  pRunAcc = 0;
  pAirAcc = 0;
}

function addParticle(p) {
  if (particles.length >= MAX_PARTICLES) particles.shift(); // drop oldest
  particles.push(p);
}

// o IS OPTIONAL: { color, life, size, drag } OVERRIDE THE RUN / AIR TRAIL DEFAULTS (THE DOUBLE JUMP'S SPIRAL MOTES USE THIS)
function spawnTrail(x, y, vx, vy, o = {}) {
  addParticle({
    kind: "trail",
    x, y, vx, vy,
    drag: o.drag ?? 2.5,
    gravity: 0,
    age: 0,
    life: o.life ?? rnd(TRAIL_LIFE[0], TRAIL_LIFE[1]),
    r0: o.size ?? rnd(TRAIL_SIZE[0], TRAIL_SIZE[1]),
    color: o.color ?? TRAIL_RGB[Math.floor(Math.random() * TRAIL_RGB.length)],
  });
}

/* ---------- ONE-SHOT EFFECTS ----------
   SHORT SPRITE ANIMATIONS THAT PLAY ONCE AND REMOVE THEMSELVES - USED FOR
   LANDING PUFF AND SPAWN BURST. KEPT SEPARATE FROM THE HAND-ROLLED PARTICLE
   ARRAY SINCE THERE'S ONLY EVER ONE OR TWO ON SCREEN AT A TIME, SO A REAL
   (IF SHORT-LIVED) GAME OBJECT PER EFFECT IS SIMPLER THAN ADDING A SECOND
   KIND TO THE PARTICLE SYSTEM. */
function spawnOneShotFX(sprite, x, y, opts = {}) {
  const fx = k.add([
    k.sprite(sprite, { anim: "play" }),
    k.pos(x, y),
    k.anchor(opts.anchor ?? "bot"),
    k.scale(opts.scale ?? 1),
    k.z(opts.z ?? PARTICLE_Z),
  ]);
  fx.onAnimEnd(() => k.destroy(fx));
  return fx;
}

function spawnLandingPuff(impact) {
  const power = Math.min(1.5, impact / JUMP_FORCE); // ~1.0 = LANDING FROM FULL-HEIGHT JUMP
  const t = Math.min(1, power);
  const scale = PUFF_SCALE[0] + (PUFF_SCALE[1] - PUFF_SCALE[0]) * t;
  spawnOneShotFX("puff", player.pos.x, player.pos.y, { scale });
}

function updateParticleEmitters(dt) {
  if (!player) return;

  const grounded = player.isGrounded();
  // player.move() SHIFTS pos DIRECTLY (NO vel.x), SO MEASURE SIDEWAYS SPEED
  // FROM HOW FAR WE ACTUALLY TRAVELLED THIS FRAME.
  const dx = pLastX === null ? 0 : player.pos.x - pLastX;
  pLastX = player.pos.x;
  const hSpeed = dt > 0 ? Math.abs(dx) / dt : 0;
  const dir = dx !== 0 ? Math.sign(dx) : (player.flipX ? -1 : 1); // direction of travel

  if (grounded) {
    if (!pWasGrounded) landSquash(pPeakFall);
    if (!pWasGrounded && pPeakFall >= PUFF_MIN_IMPACT) spawnLandingPuff(pPeakFall);
    pAirTime = 0;
    pPeakFall = 0;
    pAirAcc = 0;

    if (hSpeed > TRAIL_MIN_SPEED) {
      pRunAcc += dt;
      while (pRunAcc >= RUN_TRAIL_INTERVAL) {
        pRunAcc -= RUN_TRAIL_INTERVAL;
        spawnTrail(
          player.pos.x - dir * rnd(1, 5),
          player.pos.y - RUN_TRAIL_HEIGHT + rnd(-20, 20),
          -dir * rnd(10, 50),
          -rnd(10, 45),
        );
      }
    } else {
      pRunAcc = 0;
    }
  } else {
    pAirTime += dt;
    pPeakFall = Math.max(pPeakFall, player.vel.y);
    pRunAcc = 0;

    if (pAirTime > AIR_TRAIL_DELAY) {
      pAirAcc += dt;
      while (pAirAcc >= AIR_TRAIL_INTERVAL) {
        pAirAcc -= AIR_TRAIL_INTERVAL;
        spawnTrail(
          player.pos.x + rnd(-14, 14),
          player.pos.y - rnd(15, 75),
          hSpeed > TRAIL_MIN_SPEED ? -dir * rnd(0, 40) : rnd(-25, 25),
          rnd(-25, 25),
        );
      }
    }
  }

  pWasGrounded = grounded;
}

function stepParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    if (p.age >= p.life) {
      particles.splice(i, 1);
      continue;
    }
    const drag = Math.exp(-p.drag * dt); // frame-rate independent friction
    p.vx *= drag;
    p.vy = p.vy * drag + p.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const t = p.age / p.life; // 0 -> 1 OVER PARTICLE'S LIFE
    const pos = k.vec2(p.x, p.y);
    const fade = Math.pow(1 - t, 1.5);
    const r = p.r0 * (1 - 0.7 * t);
    if (TRAIL_GLOW > 0) {
      k.drawCircle({ pos, radius: r * TRAIL_GLOW, color: p.color, opacity: 0.18 * fade });
    }
    k.drawCircle({ pos, radius: r, color: p.color, opacity: 0.95 * fade });
  }
}

// SEPARATE UPDATE LOOP (LIKE THE DEBUG READOUT) SO PARTICLES KEEP FLOWING
// EVEN DURING THE isAttacking EARLY-RETURN IN MAIN onUpdate.
k.onUpdate(() => {
  const dt = k.dt();
  updateCloakAnim(dt);
  updateDoubleJump(dt); // BEFORE THE EMITTERS / GHOSTS BELOW SO THIS FRAME'S SPIRAL SHOWS UP THIS FRAME
  updateAirKick(dt);
  updateParticleEmitters(dt);
  stepParticles(dt);
  updateSquash(dt);
  updateCape(dt);
  stepCloth(dt);
  emitGhosts(dt);
  stepGhosts(dt);
  updateCamera();   // BEFORE updateLighting(), SO LIGHTS USE THIS FRAME'S FINAL CAMERA
  updateLighting();
});

/* ---------- STARTER-PACK EFFECTS: RUNTIME ----------
   EVERYTHING BELOW SUPPORTS THE FX FLAGS UP TOP. NOTHING HERE TOUCHES THE
   PLAYER'S pos / vel / HITBOX EXCEPT THE DASH IN THE MAIN LOOP ABOVE. */

// COLORS PRE-BUILT ONCE (k EXISTS BY NOW). k.rgb() KEEPS 0-255; THE SHADERS DIVIDE BY 255.
const GHOST_RGB = GHOST_COLORS.map((c) => k.rgb(c));
const EDGE_INNER_RGB = k.rgb(DISSOLVE_EDGE_INNER);
const EDGE_OUTER_RGB = k.rgb(DISSOLVE_EDGE_OUTER);
const AMBIENT_RGB = k.rgb(LIGHT_AMBIENT_COLOR);
const LIGHT_PLAYER_RGB = k.rgb(LIGHT_PLAYER.color);
const LIGHT_SPELL_RGB = k.rgb(LIGHT_SPELL.color);

/* ----- 1. SQUASH & STRETCH -----
   A DAMPED SPRING PER AXIS. kickSquash() SNAPS THE SCALE TO A POSE AND THE
   SPRING RELAXES IT BACK TO THE TARGET (1,1 - OR A SPEED-BASED STRETCH IN THE AIR). */
function kickSquash(x, y) {
  if (!FX.squash) return;
  squash.x = x;
  squash.y = y;
  squash.vx = 0;
  squash.vy = 0;
}

function landSquash(impact) {
  if (impact < SQUASH_LAND_MIN_IMPACT) return;
  const t = Math.min(1, (impact - SQUASH_LAND_MIN_IMPACT) / (SQUASH_LAND_FULL_IMPACT - SQUASH_LAND_MIN_IMPACT));
  kickCape(-t);
  kickSquash(
    1 + (SQUASH_LAND_MAX.x - 1) * t,
    1 + (SQUASH_LAND_MAX.y - 1) * t,
  );
}

function updateSquash(dt) {
  if (!FX.squash || !player) {
    squash.x = squash.y = 1;
    squash.vx = squash.vy = 0;
    return;
  }
  let tx = 1;
  let ty = 1;
  if (dashTimer > 0) { // HOLD THE LONG-LOW DASH POSE FOR THE WHOLE DASH
    tx = SQUASH_DASH.x;
    ty = SQUASH_DASH.y;
  } else if (!player.isGrounded() && currentAnim !== "wallSlide" && currentAnim !== "doubleJump") { // STRETCH WITH VERTICAL SPEED (NOT WHILE THE BALL SPINS - IT WOULD SHEAR)
    const s = Math.min(1, Math.abs(player.vel.y) / SQUASH_AIR_STRETCH_VEL);
    ty = 1 + SQUASH_AIR_STRETCH * s;
    tx = 1 - SQUASH_AIR_STRETCH * s * 0.6; // ROUGHLY KEEPS THE AREA CONSTANT
  }
  const h = Math.min(dt, 1 / 30); // CLAMP SO A LAG SPIKE CAN'T EXPLODE THE SPRING
  squash.vx += (-SQUASH_STIFFNESS * (squash.x - tx) - SQUASH_DAMPING * squash.vx) * h;
  squash.vy += (-SQUASH_STIFFNESS * (squash.y - ty) - SQUASH_DAMPING * squash.vy) * h;
  squash.x += squash.vx * h;
  squash.y += squash.vy * h;
}

/* ----- 2. HIT-STOP -----
   k.debug.timeScale SCALES k.dt() FOR EVERYTHING (PHYSICS, ANIMS, TWEENS,
   k.wait TIMERS), SO SETTING IT TO 0 FREEZES THE WHOLE GAME. THE RESTORE USES
   A REAL setTimeout BECAUSE ANY KAPLAY TIMER WOULD BE FROZEN TOO. THE CAMERA
   SHAKE STILL JITTERS DURING THE FREEZE (updateCamera STAYS ON), WHICH SELLS IT. */
let hitStopTimeout = null;
function hitStop(seconds) {
  if (!FX.hitStop) return;
  // NOT EXACTLY 0: kaplay's body() INTERPOLATES BETWEEN PHYSICS STEPS ONLY WHILE restDt() * timeScale
  // IS NON-ZERO. AT timeScale = 0 THE PLAYER'S fixedUpdate CLEARS ITS "PREVIOUS PHYSICS POSITION" AND
  // NEVER RE-SETS IT, SO THE FIRST FRAME AFTER THE FREEZE CRASHED ("Cannot read properties of null
  // (reading 'x')" IN body.ts). A TINY SCALE FREEZES EVERYTHING THE SAME TO THE EYE AND KEEPS IT SAFE.
  k.debug.timeScale = HITSTOP_TIMESCALE;
  clearTimeout(hitStopTimeout);
  hitStopTimeout = setTimeout(() => {
    k.debug.timeScale = 1;
  }, seconds * 1000);
}

/* ----- 3. DASH + AFTERIMAGES ----- */
function tryDash() {
  if (!FX.dash || !player || isAttacking) return;
  if (dashTimer > 0 || dashCooldown > 0 || wallJumpLock > 0) return;
  const grounded = player.isGrounded();
  if (!grounded && !airDashReady) return;
  if (!grounded) airDashReady = false;

  dashDir = player.flipX ? -1 : 1;
  dashTimer = DASH_TIME;
  dashCooldown = DASH_COOLDOWN;
  ghostAcc = GHOST_INTERVAL; // FIRST GHOST ON THE VERY NEXT FRAME
  kickSquash(SQUASH_DASH.x, SQUASH_DASH.y);
  kickCape(1);
  shakeCamera(0.08, 4);
}

function emitGhosts(dt) {
  if (!FX.dash || !player || dashTimer <= 0) return;
  ghostAcc += dt;
  while (ghostAcc >= GHOST_INTERVAL) {
    ghostAcc -= GHOST_INTERVAL;
    ghosts.push({
      // SNAPSHOT OF EXACTLY WHAT THE PLAYER LOOKS LIKE RIGHT NOW. THE LIFT / SIDEWAYS
      // OFFSET / SQUASH ARE LOCAL-SPACE (SO THEY GET SCALED BY SCALE), MATCHING WHAT
      // THE squashBegin/liftBegin/hOffsetBegin COMPONENTS DO TO THE REAL SPRITE.
      x: player.pos.x + wallSlideHOffset * SCALE * squash.x,
      y: player.pos.y - visualLift * SCALE * squash.y,
      sx: squash.x,
      sy: squash.y,
      sheet: player.sheet,
      frame: player.frame,
      flip: player.flipX,
      ang: player.spin || 0, // A DASH MID-FLIP KEEPS THE BALL'S ROTATION IN ITS AFTERIMAGES (SEE drawSpiralGhost)
      age: 0,
      color: GHOST_RGB[ghostColorIdx++ % GHOST_RGB.length],
    });
  }
}

/* GHOSTS COME IN TWO KINDS. THE DASH'S ARE JUST A FROZEN SNAPSHOT (NO EXTRA FIELDS). THE DOUBLE JUMP'S SPIRAL GHOSTS ALSO CARRY:
     life - THEIR OWN LIFETIME (DEFAULT GHOST_LIFE)         vx, vy, drag - OUTWARD DRIFT IN PX/S, SLOWED BY drag
     ang, angVel - ROTATION (DEG) + SPIN SPEED (DEG/S)      pivot - ART PX ABOVE THE FEET THAT IT ROTATES AROUND
     grow - EXTRA SIZE BLOOMED TO OVER ITS LIFE             mode - "dissolve" = BURNS AWAY, OTHERWISE A FLAT NEON SILHOUETTE
     u - ITS OWN SHADER UNIFORM OBJECT, CREATED ONCE AT SPAWN AND MUTATED EACH DRAW SO THERE'S NO PER-FRAME ALLOCATION */
function stepGhosts(dt) {
  for (let i = ghosts.length - 1; i >= 0; i--) {
    const g = ghosts[i];
    g.age += dt;
    if (g.age >= (g.life ?? GHOST_LIFE)) {
      ghosts.splice(i, 1);
      continue;
    }
    if (g.vx !== undefined) { // SPIRAL GHOST: DRIFT OUTWARD + KEEP SPINNING, BOTH EASING OFF
      const d = Math.exp(-g.drag * dt); // FRAME-RATE INDEPENDENT, LIKE THE PARTICLES
      g.vx *= d;
      g.vy *= d;
      g.x += g.vx * dt;
      g.y += g.vy * dt;
      g.ang += g.angVel * dt;
      g.angVel *= d;
    }
  }
}

// ONE GHOST DRAWN INSIDE ITS OWN TRANSFORM, SO IT CAN ROTATE ABOUT THE BALL'S CENTER. SAME PLACEMENT MATH AS THE
// PLAYER'S OWN DRAW: translate to the feet -> squash/size -> rotate about the pivot -> sprite at (pl.ox, pl.oy).
function drawSpiralGhost(g, t, pl) {
  const fade = Math.pow(1 - t, 1.5);
  const sc = SCALE * (g.grow ? 1 + g.grow * t : 1 - 0.12 * t);
  k.pushTransform();
  k.pushTranslate(g.x, g.y);
  k.pushScale(sc * g.sx, sc * g.sy);
  if (g.ang) {
    const cy = pl.oy - (g.pivot ?? DOUBLE_JUMP.pivotY) * pl.s;
    k.pushTranslate(pl.ox, cy);
    k.pushRotate(g.ang);
    k.pushTranslate(-pl.ox, -cy);
  }
  const base = {
    sprite: sheetSprite(g.sheet),
    frame: g.frame,
    pos: k.vec2(pl.ox, pl.oy),
    anchor: "bot",
    scale: pl.s,
    flipX: g.flip,
  };
  if (g.mode === "dissolve" && g.u) {
    g.u.u_amount = Math.min(1, 0.1 + t * 0.95); // STARTS ALMOST WHOLE, ENDS FULLY EATEN, THE BURN EDGE GLOWING ALL THE WAY
    k.drawSprite({ ...base, opacity: (g.alpha ?? GHOST_ALPHA) * (1 - 0.5 * t), shader: "dissolve", uniform: g.u });
  } else if (g.u) {
    g.u.u_alpha = (g.alpha ?? GHOST_ALPHA) * fade;
    k.drawSprite({ ...base, shader: "silhouette", uniform: g.u });
  } else { // A DASH GHOST CAUGHT MID-FLIP
    k.drawSprite({ ...base, shader: "silhouette", uniform: { u_color: g.color, u_alpha: GHOST_ALPHA * fade } });
  }
  k.popTransform();
}

function drawGhosts() {
  for (const g of ghosts) {
    const t = g.age / (g.life ?? GHOST_LIFE); // 0 -> 1 OVER THE GHOST'S LIFE
    const shrink = 1 - 0.12 * t;  // SLIGHT SHRINK SO THE TRAIL TAPERS
    const pl = sheetPlace(g.sheet, g.frame, g.flip);
    if (g.ang || g.u) { // ROTATED OR SPIRAL (DOUBLE JUMP FLIP): NEEDS THE TRANSFORM PATH
      drawSpiralGhost(g, t, pl);
      continue;
    }
    k.drawSprite({
      sprite: sheetSprite(g.sheet),
      frame: g.frame,
      pos: k.vec2(g.x + pl.ox * SCALE * g.sx, g.y + pl.oy * SCALE * g.sy),
      anchor: "bot",
      scale: k.vec2(SCALE * g.sx * shrink * pl.s, SCALE * g.sy * shrink * pl.s),
      flipX: g.flip,
      shader: "silhouette",
      uniform: { u_color: g.color, u_alpha: GHOST_ALPHA * Math.pow(1 - t, 1.5) },
    });
  }
}

/* ----- 3b. DOUBLE JUMP -----
   FLIP = JUMP FRAME 2, SPUN. SEE DOUBLE_JUMP UP TOP FOR WHAT EVERY NUMBER DOES. THE SPIN, ITS CANCEL CONDITIONS AND ITS
   EMISSIONS RUN IN THE ALWAYS-ON LOOP (updateDoubleJump), NOT THE MAIN ONE, SO THEY KEEP TIME DURING THE isAttacking EARLY-RETURN.
   FOR A GODOT PORT: THE ALGORITHM IS JUST "ANGLE = 360 * TURNS * EASE(t / T)" PLUS TWO EMITTERS WHOSE DIRECTION IS THAT ANGLE -
   A CPUParticles2D (OR A LITTLE SCRIPT SPAWNING SPRITES) ROTATED BY THE SAME VALUE. */
function startDoubleJump() {
  const D = DOUBLE_JUMP;
  const dj = doubleJump;
  airJumpReady = false;
  dashTimer = 0;                 // THE JUMP WINS OVER AN AIR DASH IN PROGRESS (AN AIR DASH ZEROES vel.y EVERY FRAME, WHICH WOULD EAT THE KICK)
  player.vel.y = -D.force;
  jumpStartTimer = 0;
  landTimer = 0;
  dj.t = D.spinTime;
  dj.angle = 0;
  dj.angVel = 0;
  dj.dir = player.flipX ? -1 : 1; // SPINS FORWARD (A SOMERSAULT IN THE DIRECTION YOU FACE); LOCKED SO TURNING MID-AIR DOESN'T REVERSE IT
  dj.ghostAcc = 0;
  dj.moteAcc = 0;
  playAnim("doubleJump");
  kickSquash(D.squash.x, D.squash.y);
  kickCape(-1);
  spawnDoubleJumpBurst();
}

// WORLD POSITION OF THE SPINNING BALL'S CENTER (SAME PLACEMENT MATH AS THE PLAYER'S OWN DRAW)
function doubleJumpCenter() {
  const pl = sheetPlace("jump", JUMP_FRAME.flip, player.flipX);
  return {
    x: player.pos.x + pl.ox * SCALE * squash.x,
    y: player.pos.y + (pl.oy - DOUBLE_JUMP.pivotY * pl.s) * SCALE * squash.y,
  };
}

function updateDoubleJump(dt) {
  const D = DOUBLE_JUMP;
  const dj = doubleJump;
  if (!player) {
    dj.t = 0;
    return;
  }
  if (dj.t <= 0 || currentAnim !== "doubleJump") { // FINISHED, OR CUT SHORT (LANDED / WALL SLIDE / ATTACK / RESPAWN)
    dj.t = 0;
    player.spin = 0;
    return;
  }
  if (dt <= 0) return; // HIT-STOP FREEZE

  dj.t = Math.max(0, dj.t - dt);
  const u = 1 - dj.t / D.spinTime;
  const prev = dj.angle;
  dj.angle = 360 * D.turns * k.easings.easeOutQuad(u); // FAST OUT OF THE LAUNCH, EASING TO A STOP EXACTLY UPRIGHT
  dj.angVel = (dj.angle - prev) / dt;
  const ang = dj.angle * dj.dir; // SIGNED DEGREES, + = CLOCKWISE ON SCREEN
  player.spin = ang;

  const c = doubleJumpCenter();
  dj.ghostAcc += dt;
  while (dj.ghostAcc >= D.ghostInterval) {
    dj.ghostAcc -= D.ghostInterval;
    spawnSpiralGhost(c, ang);
  }
  dj.moteAcc += dt;
  while (dj.moteAcc >= D.moteInterval) {
    dj.moteAcc -= D.moteInterval;
    spawnSpiralMotes(c, ang);
  }
}

// ONE AFTERIMAGE OF THE BALL, SHOT OUT ALONG THE DIRECTION IT'S CURRENTLY SPUN TO. THE ANGLE KEEPS ADVANCING, SO SUCCESSIVE
// GHOSTS FAN OUT INTO A SPIRAL. EVERY OTHER ONE IS A DISSOLVING COPY INSTEAD OF A FLAT SILHOUETTE.
function spawnSpiralGhost(c, ang) {
  const D = DOUBLE_JUMP;
  const dj = doubleJump;
  const th = (ang * Math.PI) / 180;
  const dissolve = dj.ghostN++ % 2 === 1;
  const color = GHOST_RGB[ghostColorIdx++ % GHOST_RGB.length];
  const sheetName = sheetSprite("jump");
  let u;
  if (dissolve) { // THE SPAWN DISSOLVE'S UNIFORMS (FRAME RECT, NOISE SIZE, BURN COLORS), BUT OURS TO ANIMATE
    u = dissolveUniform(sheetName, JUMP_FRAME.flip);
    u.u_cell = D.ghostCell;
  } else {
    u = { u_color: color, u_alpha: D.ghostAlpha };
  }
  ghosts.push({
    x: player.pos.x,
    y: player.pos.y,
    sx: squash.x,
    sy: squash.y,
    sheet: "jump",
    frame: JUMP_FRAME.flip,
    flip: player.flipX,
    age: 0,
    life: D.ghostLife,
    color,
    ang,
    angVel: dj.angVel * dj.dir * D.ghostSpin,
    pivot: D.pivotY,
    vx: Math.cos(th) * D.ghostSpeed,
    vy: Math.sin(th) * D.ghostSpeed + player.vel.y * D.ghostInherit,
    drag: D.ghostDrag,
    grow: D.ghostGrow,
    alpha: D.ghostAlpha,
    mode: dissolve ? "dissolve" : "tint",
    u,
  });
}

// MOTES SHOT OUT IN `arms` EVENLY SPACED SPIRAL ARMS. EACH GETS AN OUTWARD VELOCITY PLUS A SIDEWAYS ONE IN THE SPIN'S DIRECTION,
// SO IT CURLS AS IT SLOWS DOWN; THE EMISSION ANGLE RIDES THE SPIN, WHICH IS WHAT DRAWS THE ARMS.
function spawnSpiralMotes(c, ang) {
  const D = DOUBLE_JUMP;
  const dir = doubleJump.dir;
  for (let a = 0; a < D.arms; a++) {
    const th = ((ang + (360 / D.arms) * a) * Math.PI) / 180;
    const rx = Math.cos(th);
    const ry = Math.sin(th);
    const sp = rnd(D.moteSpeed[0], D.moteSpeed[1]);
    const side = sp * D.swirl * dir; // TANGENT TO THE RADIUS, ALONG THE SPIN
    spawnTrail(
      c.x + rx * D.startRadius,
      c.y + ry * D.startRadius,
      rx * sp - ry * side,
      ry * sp + rx * side + player.vel.y * D.ghostInherit,
      {
        color: DJ_MOTE_RGB[Math.floor(Math.random() * DJ_MOTE_RGB.length)],
        life: rnd(D.moteLife[0], D.moteLife[1]),
        size: rnd(D.moteSize[0], D.moteSize[1]),
        drag: D.moteDrag,
      },
    );
  }
}

// A SWIRLING RING OF MOTES FROM THE BALL'S CENTER AT THE MOMENT OF LAUNCH
function spawnDoubleJumpBurst() {
  const D = DOUBLE_JUMP;
  const dir = doubleJump.dir;
  const c = doubleJumpCenter();
  for (let i = 0; i < D.burst; i++) {
    const th = (i / D.burst) * Math.PI * 2;
    const rx = Math.cos(th);
    const ry = Math.sin(th);
    const sp = rnd(D.moteSpeed[0], D.moteSpeed[1] * 1.3);
    const side = sp * D.swirl * dir;
    spawnTrail(
      c.x + rx * D.startRadius,
      c.y + ry * D.startRadius,
      rx * sp - ry * side,
      ry * sp + rx * side,
      {
        color: DJ_MOTE_RGB[i % DJ_MOTE_RGB.length],
        life: rnd(D.moteLife[0], D.moteLife[1]),
        size: rnd(D.moteSize[0], D.moteSize[1]),
        drag: D.moteDrag,
      },
    );
  }
}

/* ----- 4. DISSOLVE -----
   dissolveAmount 1 -> 0 MATERIALIZES, 0 -> 1 DISSOLVES AWAY. BOTH THE BODY (THE
   shader() COMPONENT ON THE PLAYER) AND THE CAPE (cloakLayer) FEED THE SAME SHADER
   THROUGH dissolveUniform(). */
function dissolveUniform(spriteName, frame) {
  const data = k.getSprite(spriteName)?.data;
  const q = data?.frames?.[frame];
  return {
    u_amount: FX.dissolve ? dissolveAmount : 0,
    u_origin: q ? k.vec2(q.x, q.y) : k.vec2(0, 0),            // THIS FRAME'S TOP-LEFT IN THE TEXTURE (0-1)
    u_texSize: data ? k.vec2(data.tex.width, data.tex.height) : k.vec2(1, 1), // TEXTURE SIZE IN PX
    u_cell: DISSOLVE_CELL,
    u_edge: DISSOLVE_EDGE,
    u_edgeA: EDGE_INNER_RGB,
    u_edgeB: EDGE_OUTER_RGB,
  };
}

let dissolvingOut = false;
function startSpawnDissolve() {
  if (dissolveTween) dissolveTween.cancel();
  dissolvingOut = false;
  if (!FX.dissolve) {
    dissolveAmount = 0;
    return;
  }
  dissolveAmount = 1;
  dissolveTween = k.tween(1, 0, DISSOLVE_SPAWN_TIME, (v) => (dissolveAmount = v), k.easings.easeOutQuad);
}

function dissolveOutAndRespawn() {
  if (!player || dissolvingOut) return;
  if (!FX.dissolve) {
    spawnPlayer();
    return;
  }
  dissolvingOut = true;
  if (dissolveTween) dissolveTween.cancel();
  dissolveTween = k.tween(dissolveAmount, 1, DISSOLVE_OUT_TIME, (v) => (dissolveAmount = v), k.easings.easeInQuad);
  dissolveTween.onEnd(() => {
    spawnPlayer(); // spawnPlayer() -> startSpawnDissolve() FADES THE NEW BODY BACK IN
  });
}

// CALLED BY spawnPlayer(): CLEARS PER-LIFE STATE SO A RESPAWN STARTS CLEAN
function resetEffectState() {
  squash.x = squash.y = 1;
  squash.vx = squash.vy = 0;
  dashTimer = 0;
  dashCooldown = 0;
  airDashReady = true;
  airJumpReady = true;
  airKickReady = true;
  airKick.t = 0;
  jumpStartTimer = 0;
  landTimer = 0;
  wasAirborne = false;
  airPeakFall = 0;
  doubleJump.t = 0;
  jumpBlend = 0;
  jumpRoot.set = false;
  ghosts.length = 0;
  capeSpring.a = capeSpring.v = 0;
  capeHVel = 0;
  capePrevX = null;
  idleBlend = 1; // SPAWNS STANDING STILL
  attackBlend = 0;
  cloth.gustT = 0;
  cloth.need = true;
}

/* ----- 5. FAKE LIGHTING -----
   LAMPS ARE DRAWN BY ONE LAYER (NO PER-LAMP OBJECTS). THE OVERLAY'S SHADER WANTS
   LIGHT POSITIONS AS (OFFSET FROM SCREEN CENTER) / (SCREEN HEIGHT), SO THE
   FALLOFF STAYS CIRCULAR AT ANY WINDOW SHAPE. */
const LAMPS = Array.from({ length: LAMP_COUNT }, (_, i) => ({
  x: LAMP_FIRST_X + i * LAMP_SPACING,
  rgb: k.rgb(LAMP_COLORS[i % LAMP_COLORS.length]),
  phase: i * 1.7,
}));

// SLOW SWELL + TWO FASTER WOBBLES = A LIVING NEON FLICKER, NEVER JUST A SINE WAVE
function lampFlicker(lamp) {
  const t = k.time();
  return 1 + 0.04 * Math.sin(t * 2.1 + lamp.phase)
           + 0.035 * Math.sin(t * 11 + lamp.phase * 2.3)
           + 0.02 * Math.sin(t * 27 + lamp.phase * 5.1);
}

// TORCH GEOMETRY (WORLD PX), SHARED BY THE DRAW CODE AND THE LIGHTING:
//   torchTopY  - TOP OF THE TORCH ART (ITS BOTTOM SITS ON THE GROUND)
//   flameBaseY - WHERE THE FLAME'S BASE LANDS ON THE TORCH HEAD
//   flameLightY - CENTER OF THE FLAME'S BODY = WHERE THE LIGHT SOURCE IS
const torchTopY = GROUND_Y - TORCH_H * TORCH_SCALE;
const flameBaseY = torchTopY + TORCH_FLAME_Y * TORCH_SCALE;
const flameLightY = flameBaseY - (FLAME_BASE_FRAC - FLAME_CENTER_FRAC) * 400 * FLAME_SCALE;

function drawLamps() {
  const cam = k.getCamPos();
  const half = k.width() / 2 + 100;
  const t = k.time();
  for (const lamp of LAMPS) {
    if (Math.abs(lamp.x - cam.x) > half) continue; // OFF-SCREEN

    // TORCH: BOTTOM-CENTER ANCHORED ON THE GROUND
    k.drawSprite({
      sprite: "torch",
      pos: k.vec2(lamp.x, GROUND_Y),
      anchor: "bot",
      scale: TORCH_SCALE,
    });

    // FLAME: PER-TORCH TIME OFFSET SO THEY DON'T ALL FLICKER IN LOCKSTEP. ANCHOR IS THE FLAME'S BASE POINT
    // (kaplay ANCHOR y RUNS -1 TOP .. +1 BOTTOM), SO THE BASE LANDS ON flameBaseY
    const frame = Math.floor(t * FLAME_FPS + lamp.phase * 2) % FLAME_FRAME_COUNT;
    const f = lampFlicker(lamp);
    k.drawSprite({
      sprite: "flame",
      frame,
      pos: k.vec2(lamp.x, flameBaseY),
      anchor: k.vec2(0, FLAME_BASE_FRAC * 2 - 1),
      scale: FLAME_SCALE * (0.97 + 0.06 * (f - 0.9)), // TINY SWELL WITH THE LIGHT FLICKER
    });
  }
}

// ONE VEC2 + FLOAT + COLOR UNIFORM PER LIGHT SLOT (NAMES u_p0/u_r0/u_c0 ...)
const lightUniform = {
  u_aspect: 1,
  u_ambient: LIGHT_AMBIENT,
  u_glow: LIGHT_GLOW,
  u_ambCol: AMBIENT_RGB,
};
for (let i = 0; i < MAX_LIGHTS; i++) {
  lightUniform[`u_p${i}`] = k.vec2(0, 0);
  lightUniform[`u_r${i}`] = 0;
  lightUniform[`u_c${i}`] = AMBIENT_RGB;
}

let lightOverlay = null;

function updateLighting() {
  if (!lightOverlay || !lightingOn || !player) return;
  const W = k.width();
  const H = k.height();
  const cam = k.getCamPos();
  const lights = []; // { x, y } IN WORLD PX, r IN PX, rgb

  lights.push({
    x: player.pos.x,
    y: player.pos.y - LIGHT_PLAYER.height,
    r: LIGHT_PLAYER.radius * (1 + 0.015 * Math.sin(k.time() * 3)),
    rgb: LIGHT_PLAYER_RGB,
  });

  for (let i = 0; i < Math.min(2, activeSpells.length); i++) {
    const s = activeSpells[i];
    lights.push({ x: s.pos.x, y: s.pos.y, r: LIGHT_SPELL.radius * (1 + 0.06 * Math.sin(k.time() * 40)), rgb: LIGHT_SPELL_RGB });
  }

  // NEAREST ON-SCREEN LAMPS FILL THE REMAINING SLOTS
  const orbY = flameLightY; // LIGHT SITS AT THE CENTER OF THE FLAME
  const room = MAX_LIGHTS - lights.length;
  const near = LAMPS
    .filter((l) => Math.abs(l.x - cam.x) < W / 2 + LAMP_RADIUS)
    .sort((a, b) => Math.abs(a.x - cam.x) - Math.abs(b.x - cam.x))
    .slice(0, room);
  for (const l of near) lights.push({ x: l.x, y: orbY, r: LAMP_RADIUS * lampFlicker(l), rgb: l.rgb });

  lightUniform.u_aspect = W / H;
  for (let i = 0; i < MAX_LIGHTS; i++) {
    const L = lights[i];
    if (!L) {
      lightUniform[`u_r${i}`] = 0;
      continue;
    }
    // WORLD -> OFFSET FROM SCREEN CENTER, IN SCREEN HEIGHTS. THE CAMERA CENTERS ON
    // cam AND WE NEVER ZOOM OR ROTATE IT, SO IT'S JUST A SUBTRACTION.
    lightUniform[`u_p${i}`] = k.vec2((L.x - cam.x) / H, (L.y - cam.y) / H);
    lightUniform[`u_r${i}`] = L.r / H;
    lightUniform[`u_c${i}`] = L.rgb;
  }
}

/* ---------- SHADERS ----------
   kaplay SHADER FORMAT: WE SUPPLY ONLY THE frag() FUNCTION (PLUS ANY HELPERS /
   uniform DECLARATIONS); def_frag() GIVES THE NORMAL TEXTURED PIXEL. COLOR
   UNIFORMS ARRIVE AS 0-255, HENCE THE "/ 255.0". */
const DISSOLVE_FRAG = `
uniform float u_amount;
uniform vec2 u_origin;
uniform vec2 u_texSize;
uniform float u_cell;
uniform float u_edge;
uniform vec3 u_edgeA;
uniform vec3 u_edgeB;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

// SMOOTH VALUE NOISE: RANDOM VALUES AT INTEGER GRID POINTS, BLENDED BETWEEN THEM
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

vec4 frag(vec2 pos, vec2 uv, vec4 color, sampler2D tex) {
  vec4 base = def_frag();
  if (u_amount <= 0.0) return base;

  // PIXEL POSITION WITHIN THIS FRAME (NOT THE WHOLE SHEET), SO THE PATTERN STAYS PUT ON THE ART
  vec2 px = (uv - u_origin) * u_texSize;
  float n = vnoise(px / u_cell) * 0.65 + vnoise(px / (u_cell * 0.4) + 17.0) * 0.35;
  n = clamp((n - 0.18) / 0.64, 0.0, 1.0); // STRETCH THE NOISE TO THE FULL 0..1 RANGE

  // THRESHOLD SWEEPS FROM BELOW THE NOISE RANGE (NOTHING GONE) TO ABOVE IT (EVERYTHING GONE)
  float thr = u_amount * (1.0 + u_edge) - u_edge;
  if (n < thr) return vec4(0.0);

  float band = (n - thr) / u_edge; // 0 AT THE BURN FRONT -> 1 WHERE THE ART IS UNTOUCHED
  if (band < 1.0 && base.a > 0.0) {
    // PREMULTIPLIED OUTPUT (kaplay BLENDS WITH src = ONE), SO SCALE THE GLOW BY ALPHA
    return vec4(mix(u_edgeA, u_edgeB, band) / 255.0 * base.a, base.a);
  }
  return base;
}
`;

/* CAPE DISSOLVE (GHOST TAIL): SAME NOISE AS DISSOLVE_FRAG, BUT THE THRESHOLD GROWS ALONG THE CAPE
   INSTEAD OF OVER TIME. THE RIBBON'S UVs ARE (u = ACROSS 0..1, v = ALONG COLLAR 0 -> HEM 1), SO THE NOISE
   IS MEASURED IN CAPE PX (u_len ALONG, u_wid ACROSS) AND STAYS GLUED TO THE CLOTH AS IT MOVES. */
const CAPE_DISSOLVE_FRAG = `
uniform float u_start;
uniform float u_amt;
uniform float u_cell;
uniform float u_edge;
uniform float u_flow;
uniform float u_fade;
uniform float u_glow;
uniform float u_time;
uniform float u_len;
uniform float u_wid;
uniform vec3 u_edgeA;
uniform vec3 u_edgeB;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

vec4 frag(vec2 pos, vec2 uv, vec4 color, sampler2D tex) {
  vec4 base = def_frag();
  float t = clamp((uv.y - u_start) / max(1.0 - u_start, 0.001), 0.0, 1.0); // 0 ABOVE THE START -> 1 AT THE HEM
  if (t <= 0.0) return base;

  vec2 px = vec2(uv.y * u_len - u_time * u_flow, uv.x * u_wid);
  float n = vnoise(px / u_cell) * 0.65 + vnoise(px / (u_cell * 0.4) + 17.0) * 0.35;
  n = clamp((n - 0.18) / 0.64, 0.0, 1.0);

  float thr = t * u_amt * (1.0 + u_edge) - u_edge;
  if (n < thr) return vec4(0.0);

  float keep = 1.0 - u_fade * t; // ALPHA FADE TOWARD THE HEM
  float band = (n - thr) / u_edge;
  if (band < 1.0 && base.a > 0.0) {
    vec3 glow = mix(u_edgeA, u_edgeB, band) / 255.0 * (1.0 + 0.6 * u_glow * (1.0 - band));
    float a = base.a * keep;
    return vec4(glow * a, a); // PREMULTIPLIED, SAME AS DISSOLVE_FRAG
  }
  return base * keep;
}
`;

const SILHOUETTE_FRAG = `
uniform vec3 u_color;
uniform float u_alpha;

vec4 frag(vec2 pos, vec2 uv, vec4 color, sampler2D tex) {
  vec4 c = def_frag();
  float a = c.a * u_alpha;
  return vec4(u_color / 255.0 * a, a); // PREMULTIPLIED: kaplay BLENDS WITH src = ONE
}
`;

// BUILT FROM MAX_LIGHTS SO THE UNIFORM LIST AND THE SUM STAY IN SYNC
function buildLightingFrag() {
  const decls = [];
  const calls = [];
  for (let i = 0; i < MAX_LIGHTS; i++) {
    decls.push(`uniform vec2 u_p${i};\nuniform float u_r${i};\nuniform vec3 u_c${i};`);
    calls.push(`accumulate(p, u_p${i}, u_r${i}, u_c${i}, lit, glow, wsum);`);
  }
  return `
uniform float u_aspect;
uniform float u_ambient;
uniform float u_glow;
uniform vec3 u_ambCol;
${decls.join("\n")}

void accumulate(vec2 p, vec2 lp, float lr, vec3 lc, inout float lit, inout vec3 glow, inout float wsum) {
  if (lr <= 0.0) return;
  float f = 1.0 - clamp(distance(p, lp) / lr, 0.0, 1.0);
  f = f * f * (3.0 - 2.0 * f);             // SMOOTHSTEP FALLOFF: SOFT EDGE, BRIGHT CORE
  lit = 1.0 - (1.0 - lit) * (1.0 - f);     // "SOFT OR" SO OVERLAPPING LIGHTS DON'T BLOW OUT
  glow += lc * f;
  wsum += f;
}

vec4 frag(vec2 pos, vec2 uv, vec4 color, sampler2D tex) {
  // kaplay HANDS frag() pos AS NORMALIZED SCREEN COORDS (-1..1, y UP). CONVERT TO
  // "SCREEN HEIGHTS" FROM SCREEN CENTER (y DOWN) SO LIGHTS STAY ROUND AT ANY WINDOW SHAPE.
  vec2 p = vec2(pos.x * 0.5 * u_aspect, -pos.y * 0.5);
  float lit = 0.0;
  float wsum = 0.0;
  vec3 glow = vec3(0.0);
  ${calls.join("\n  ")}

  float dark = u_ambient * (1.0 - lit);     // HOW OPAQUE THE NIGHT IS HERE
  float tintA = u_glow * lit;               // FAINT COLOR WASH WHERE LIGHT LANDS
  vec3 tint = glow / max(wsum, 0.0001);     // AVERAGE COLOR OF THE LIGHTS HERE
  float a = dark + tintA * (1.0 - dark);
  // kaplay BLENDS WITH PREMULTIPLIED ALPHA (src = ONE, dst = 1 - srcAlpha), SO THE
  // COLOR RETURNED MUST ALREADY BE MULTIPLIED BY ITS ALPHA.
  vec3 rgbPremul = u_ambCol * dark + tint * tintA * (1.0 - dark);
  return vec4(rgbPremul / 255.0, a);
}
`;
}

async function loadShaders() {
  await k.loadShader("dissolve", null, DISSOLVE_FRAG);
  await k.loadShader("capeDissolve", null, CAPE_DISSOLVE_FRAG);
  await k.loadShader("silhouette", null, SILHOUETTE_FRAG);
  await k.loadShader("lighting", null, buildLightingFrag());
}

/* ---------- CAPE PHYSICS: RUNTIME ----------
   SEE THE CAPE PHYSICS CONFIG UP TOP FOR WHAT EACH MODE DOES. */
let capeMode = CAPE_START_MODE;
const capeSpring = { a: 0, v: 0 };   // mode 1: extra swing angle (deg) + its angular velocity
let capeHVel = 0;                    // smoothed signed horizontal speed (px/s, + = right)
let capePrevX = null;                // last frame's player x, for measuring that speed
let capeSpeed = 0;                   // |horizontal speed| / MOVE_SPEED (a dash pushes it past 1)
let capeWavePhase = 0;               // mode 1: traveling-wave phase (accumulated, so speed changes never jump it)
let capeDirSmooth = 1;               // facing eased to -1..1, so the cloth root slides across the back on a turn
let jumpBlend = 0;                   // 0 = NOT IN ONE OF THE JUMP SHEET'S CAPED POSES, 1 = IN ONE (SEE JUMP_CAPE). EASED THE SAME WAY
const jumpRoot = { x: 0, y: 0, set: false }; // THE JUMP POSES' ATTACH POINT (ART PX), EASED BETWEEN POSES SO THE CHAIN ISN'T YANKED AT EACH FRAME SWAP
let attackBlend = 0;                 // 0 = NOT CASTING, 1 = CASTING (SEE ATTACK_CAPE). EASED THE SAME WAY AS idleBlend
let idleBlend = 1;                   // 0 = RUN-STYLE CAPE PHYSICS / ROOT, 1 = IDLE-STYLE (SEE IDLE_CAPE). EASED, SO THE CHAIN NEVER SNAPS
const CAPE_RGB = CAPE_COLORS.map((c) => k.rgb(c));
const CAPE_EDGE_RGB = k.rgb(CAPE_EDGE);
const CAPE_GLOW_RGB = k.rgb(CAPE_EDGE_GLOW);

function kickCape(n) { // n: -1..1 - NEGATIVE DROOPS THE TAIL (JUMP/LAND), POSITIVE FLINGS IT BACK (DASH)
  capeSpring.v += CAPE_SPRING_KICK * n;
}

function updateCape(dt) {
  if (!player || dt <= 0) return; // dt IS 0 DURING HIT-STOP - NOTHING SHOULD MOVE
  const dir = player.flipX ? -1 : 1;

  // player.move() SHIFTS pos DIRECTLY (NO vel.x), SO MEASURE SPEED FROM DISTANCE TRAVELLED
  const dx = capePrevX === null ? 0 : player.pos.x - capePrevX;
  capePrevX = player.pos.x;
  const hv = Math.max(-3000, Math.min(3000, dx / dt));
  capeHVel += (hv - capeHVel) * Math.min(1, dt * 14);
  capeSpeed = Math.abs(capeHVel) / MOVE_SPEED;
  capeDirSmooth += (dir - capeDirSmooth) * Math.min(1, dt * 18);
  const idleTarget = IDLE_CAPE.enabled && currentAnim === "idle" ? 1 : 0;
  idleBlend += (idleTarget - idleBlend) * Math.min(1, dt * IDLE_CAPE.blendRate);
  const attackTarget = ATTACK_CAPE.enabled && currentAnim === "attack" ? 1 : 0;
  attackBlend += (attackTarget - attackBlend) * Math.min(1, dt * ATTACK_CAPE.blendRate);

  // JUMP POSES: EASE TOWARD THIS POSE'S ATTACH POINT (SEE JUMP_CAPE). THE FIRST FRAME IN ONE JUST SNAPS jumpRoot THERE -
  // jumpBlend IS STILL ~0 AT THAT POINT, SO clothRoot() EASES IN FROM THE PREVIOUS POSE'S ROOT RATHER THAN POPPING
  const jr = JUMP_CAPE.roots[currentAnim];
  jumpBlend += ((jr ? 1 : 0) - jumpBlend) * Math.min(1, dt * JUMP_CAPE.blendRate);
  if (jr) {
    const pl = sheetPlace("jump", player.frame, false); // SIZE TWEAK + FOOT SNAP (THE LAND FRAME DROPS TO THE GROUND)
    const tx = jr.x * pl.s + pl.ox;
    const ty = jr.y * pl.s + pl.oy;
    if (!jumpRoot.set) {
      jumpRoot.x = tx;
      jumpRoot.y = ty;
      jumpRoot.set = true;
    } else {
      const e = Math.min(1, dt * JUMP_CAPE.rootEase);
      jumpRoot.x += (tx - jumpRoot.x) * e;
      jumpRoot.y += (ty - jumpRoot.y) * e;
    }
  } else if (jumpBlend < 0.001) {
    jumpRoot.set = false;
  }

  // MODE 1 SPRING: THE TARGET SWING COMES FROM HOW FAST WE'RE MOVING (FORWARD = SWING BACK)
  // AND FALLING (FALLING = LIFT); THE SPRING THEN CHASES IT, OVERSHOOTING AND SETTLING.
  const rel = Math.max(-1.6, Math.min(1.6, (capeHVel * dir) / MOVE_SPEED));
  const fall = Math.max(-1, Math.min(1, player.vel.y / 1000));
  const target = CAPE_SPRING_RUN_ANGLE * rel + CAPE_SPRING_FALL_ANGLE * fall;
  const h = Math.min(dt, 1 / 30); // CLAMP SO A LAG SPIKE CAN'T EXPLODE THE SPRING
  capeSpring.v += (-CAPE_SPRING_STIFFNESS * (capeSpring.a - target) - CAPE_SPRING_DAMPING * capeSpring.v) * h;
  capeSpring.a += capeSpring.v * h;

  const t = Math.min(1, capeSpeed);
  const freq = CAPE_WARP_FREQ[0] + (CAPE_WARP_FREQ[1] - CAPE_WARP_FREQ[0]) * t;
  capeWavePhase += dt * freq * Math.PI * 2;
}

/* ----- MODE 1: STRIP-WARPED SPRITE -----
   DRAWS ONE CLOAK LAYER AS N VERTICAL SLICES OF ITS ART. EACH SLICE IS NUDGED UP/DOWN
   BY A SINE WAVE THAT GROWS FROM THE ATTACH POINT (NO MOVEMENT) TO THE FAR TIP (MOST).
   THE WHOLE THING SITS INSIDE A TRANSFORM (translate -> mirror -> rotate) SO FACING
   LEFT IS JUST A MIRROR, AND THE SPRING ANGLE IS ADDED TO THE POSE'S OWN ROTATION. */
function drawCloakWarped(which, frame, pos, rotDeg, dir) {
  if (typeof CLOAK_ANCHOR === "string") return false;
  const data = k.getSprite(which)?.data;
  const q = data?.frames?.[frame];
  if (!data || !q) return false;

  const W = data.width;   // ONE FRAME'S SIZE IN PX
  const H = data.height;
  const ax = ((CLOAK_ANCHOR.x + 1) / 2) * W; // ATTACH POINT INSIDE THE ART (PX FROM ITS TOP-LEFT)
  const ay = ((CLOAK_ANCHOR.y + 1) / 2) * H;
  const n = CAPE_WARP_STRIPS;
  const sw = W / n;
  const t = Math.min(1, capeSpeed);
  const amp = CAPE_WARP_AMP[0] + (CAPE_WARP_AMP[1] - CAPE_WARP_AMP[0]) * t;
  const fx = FX.dissolve && dissolveAmount > 0
    ? { shader: "dissolve", uniform: dissolveUniform(which, frame) }
    : {};

  k.pushTransform();
  k.pushTranslate(pos.x, pos.y);
  k.pushScale(dir * CLOAK_SCALE, CLOAK_SCALE);
  k.pushRotate(rotDeg + capeSpring.a);
  for (let j = 0; j < n; j++) {
    const xL = j * sw;
    const s = Math.max(0, Math.min(1, (ax - (xL + sw / 2)) / ax)); // 0 AT THE ATTACH POINT -> 1 AT THE FAR EDGE
    const dy = amp * Math.pow(s, 1.3) * Math.sin(capeWavePhase - s * CAPE_WARP_PHASE);
    k.drawUVQuad({
      tex: data.tex,
      quad: k.quad(q.x + (q.w * j) / n, q.y, q.w / n, q.h),
      pos: k.vec2(xL - ax, -ay + dy),
      width: sw + 0.75, // TINY OVERLAP SO NO SEAMS SHOW BETWEEN SLICES
      height: H,
      ...fx,
    });
  }
  k.popTransform();
  return true;
}

/* ----- MODE 2: VERLET CLOTH -----
   EVERY POINT STORES WHERE IT IS (x,y) AND WHERE IT WAS (px,py) - VELOCITY IS JUST THE
   DIFFERENCE, SO THERE IS NO VELOCITY VARIABLE TO KEEP IN SYNC. A STEP IS:
     1. MOVE EACH POINT BY ITS OWN MOMENTUM (MINUS AIR DRAG) PLUS GRAVITY / TURBULENCE
     2. SQUEEZE NEIGHBOURS BACK TO THEIR REST DISTANCE (REPEATED A FEW TIMES)
   THE HEAD POINT IS PINNED TO THE COLLAR, SO WHEN THE PLAYER MOVES THE REST OF THE CHAIN
   GETS DRAGGED ALONG AND LAGS BEHIND - THAT LAG *IS* THE FLOWING-CLOTH LOOK. */
const cloth = { p: [], need: true, t: 0, acc: 0, lastRoot: null, dormant: false, gustT: 0 };

// STARTS THE ATTACK'S WIND GUST (SEE ATTACK_CAPE): gustT COUNTS DOWN IN stepCloth()
function gustCape() {
  if (ATTACK_CAPE.enabled) cloth.gustT = ATTACK_CAPE.gustTime;
}

// THE CHAIN RUNS IN MODE 2, AND ALSO IN IDLE, THE SPELL CAST AND THE JUMP SHEET'S CAPED POSES IN ANY MODE (SEE IDLE_CAPE /
// ATTACK_CAPE / JUMP_CAPE). OUTSIDE ALL OF THOSE IT SLEEPS, AND stepCloth() RE-HANGS IT FROM THE COLLAR WHEN IT WAKES SO IT
// NEVER RESUMES FROM A STALE POSE.
function clothActive() {
  return !!player && (capeMode === 2
    || (IDLE_CAPE.enabled && currentAnim === "idle")
    || (ATTACK_CAPE.enabled && currentAnim === "attack")
    || !!JUMP_CAPE.roots[currentAnim]);
}

function clothRoot() { // WORLD POSITION OF THE COLLAR PIN (SAME ATTACH POINT AS THE SPRITE CLOAK)
  const pose = CLOAK_POSE[currentAnim] ?? CLOAK_POSE.run;
  const sx = SCALE * squash.x;
  const sy = SCALE * squash.y;
  let lx = pose.x + CAPE_CLOTH.rootOffset.x; // LOCAL (ART PX) ROOT FOR THE RUN-STYLE CAPE
  let ly = pose.y + CAPE_CLOTH.rootOffset.y - visualLift;
  if (idleBlend > 0.001) { // IDLE: FOLLOW THE NAPE INSTEAD, INCLUDING THE SIZE TWEAK, FOOT SNAP AND BREATHING BOB
    const fr = currentAnim === "idle" ? player.frame : 0; // player.frame BELONGS TO ANOTHER SHEET ONCE WE'VE LEFT IDLE
    const pl = sheetPlace("idle", fr, false);
    const bob = IDLE_CAPE.rootBob[fr] ?? 0;
    const ix = IDLE_CAPE.root.x * pl.s + sheetTweak("idle").offsetX;
    const iy = (IDLE_CAPE.root.y + bob) * pl.s + pl.oy;
    lx += (ix - lx) * idleBlend;
    ly += (iy - ly) * idleBlend;
  }
  if (attackBlend > 0.001) { // SPELL CAST: HANG FROM THE ATTACK ART'S NAPE (SIZE TWEAK + FOOT SNAP INCLUDED)
    const pl = sheetPlace("attack", 0, false);
    const ax = ATTACK_CAPE.root.x * pl.s + sheetTweak("attack").offsetX;
    const ay = ATTACK_CAPE.root.y * pl.s + pl.oy;
    lx += (ax - lx) * attackBlend;
    ly += (ay - ly) * attackBlend;
  }
  if (jumpBlend > 0.001) { // JUMP SHEET POSES: HANG FROM THEIR NAPE (jumpRoot ALREADY HAS THE SIZE TWEAK + FOOT SNAP IN IT)
    lx += (jumpRoot.x - lx) * jumpBlend;
    ly += (jumpRoot.y - ly) * jumpBlend;
  }
  return {
    x: player.pos.x + lx * capeDirSmooth * sx,
    y: player.pos.y + ly * sy,
  };
}

function resetCloth() { // HANG THE CHAIN STRAIGHT DOWN-AND-BACK FROM THE COLLAR (SPAWN / MODE SWITCH)
  const C = CAPE_CLOTH;
  const r = clothRoot();
  const dir = player.flipX ? -1 : 1;
  cloth.p.length = 0;
  for (let i = 0; i < C.segments; i++) {
    const x = r.x - dir * i * C.segLen * 0.35;
    const y = r.y + i * C.segLen * 0.93;
    cloth.p.push({ x, y, px: x, py: y });
  }
  cloth.need = false;
  cloth.acc = 0;
  cloth.lastRoot = r;
}

// PULL TWO POINTS TOWARD (OR AWAY FROM) EACH OTHER UNTIL THEY'RE `rest` APART. wA/wB = HOW MUCH EACH
// ONE MOVES (0 = PINNED), stiff = FRACTION OF THE ERROR FIXED THIS PASS.
function clothLink(a, b, rest, wA, wB, stiff) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const d = Math.hypot(dx, dy) || 0.0001;
  const w = wA + wB;
  if (w === 0) return;
  const diff = ((d - rest) / d) * stiff;
  a.x += dx * diff * (wA / w);
  a.y += dy * diff * (wA / w);
  b.x -= dx * diff * (wB / w);
  b.y -= dy * diff * (wB / w);
}

function stepCloth(dt) {
  if (!player || dt <= 0) return;
  if (!clothActive()) { cloth.dormant = true; return; }
  if (cloth.dormant) { cloth.dormant = false; cloth.need = true; }
  if (cloth.need) resetCloth();
  const C = CAPE_CLOTH;
  cloth.acc = Math.min(cloth.acc + dt, C.maxSteps * C.step);
  const steps = Math.floor(cloth.acc / C.step);
  if (steps === 0) return;
  cloth.acc -= steps * C.step;

  const P = cloth.p;
  const n = P.length;
  const rootNow = clothRoot();
  const rootPrev = cloth.lastRoot ?? rootNow;
  const h = C.step;
  const damp = Math.max(0, 1 - C.drag * h);
  const run = Math.min(1, capeSpeed);
  const I = IDLE_CAPE;
  const B = idleBlend;
  const A = ATTACK_CAPE;
  const Ab = attackBlend;

  for (let st = 1; st <= steps; st++) {
    // GUST: 0..1 SWELL, TWO SLOW SINES MULTIPLIED SO THE PEAKS ARE IRREGULAR RATHER THAN A METRONOME
    const gust = 0.5 + 0.5 * Math.sin(cloth.t * I.gustHz * Math.PI * 2) * (0.6 + 0.4 * Math.sin(cloth.t * 0.7 + 1));
    // SLIDE THE PIN ALONG THE FRAME'S TRAVEL, STEP BY STEP, SO FAST MOVES DON'T JERK THE CHAIN
    const f = st / steps;
    // CAST GUST ENVELOPE: SWELLS FAST, PEAKS ~1/4 OF THE WAY IN, THEN EASES OFF (0 WHEN NO GUST)
    let gustEnv = 0;
    if (cloth.gustT > 0) {
      const gp = 1 - cloth.gustT / A.gustTime; // 0 -> 1 OVER THE GUST
      gustEnv = Math.sin(Math.PI * Math.sqrt(Math.min(1, Math.max(0, gp))));
      cloth.gustT = Math.max(0, cloth.gustT - h);
    }
    P[0].x = rootPrev.x + (rootNow.x - rootPrev.x) * f;
    P[0].y = rootPrev.y + (rootNow.y - rootPrev.y) * f;
    P[0].px = P[0].x;
    P[0].py = P[0].y;

    for (let i = 1; i < n; i++) {
      const q = P[i];
      const vx = (q.x - q.px) * damp;
      const vy = (q.y - q.py) * damp;
      q.px = q.x;
      q.py = q.y;
      const tip = i / (n - 1);
      // RUN-STYLE VS IDLE-STYLE FORCES, EASED BY idleBlend. IDLE = A LIGHT STEADY LEAN BACK + SLOW GUSTS,
      // WITH TURBULENCE THAT DOESN'T DEPEND ON SPEED (THERE ISN'T ANY).
      let fl = C.flutter * run + (I.flutter - C.flutter * run) * B;
      let bias = C.backBias + (I.backBias + gust * I.gust - C.backBias) * B;
      fl += (A.flutter - fl) * Ab; // SPELL CAST: EASE INTO ITS OWN LEAN / TURBULENCE
      bias += (A.backBias - bias) * Ab;
      bias += A.gust * gustEnv; // THE CAST GUST: A BIG EXTRA PUSH TOWARD THE BACK
      fl *= tip; // TURBULENCE GROWS TOWARD THE HEM
      const ax = Math.sin(cloth.t * 9 + i * 0.8) * fl - capeDirSmooth * bias * tip;
      const ay = C.gravity * (1 - C.lift * run - A.gustLift * gustEnv) + Math.cos(cloth.t * 7.3 + i * 1.1) * fl;
      q.x += vx + ax * h * h;
      q.y += vy + ay * h * h;
    }

    for (let it = 0; it < C.iterations; it++) {
      for (let i = 0; i < n - 1; i++) clothLink(P[i], P[i + 1], C.segLen, i === 0 ? 0 : 1, 1, 1);
      for (let i = 0; i < n - 2; i++) clothLink(P[i], P[i + 2], C.segLen * 2 * 0.97, i === 0 ? 0 : 1, 1, C.bend);
    }
    for (let i = 1; i < n; i++) if (P[i].y > GROUND_Y - 2) P[i].y = GROUND_Y - 2; // DON'T SINK INTO THE FLOOR
    cloth.t += h;
  }
  cloth.lastRoot = rootNow;
}

const LINING_RGB = IDLE_CAPE.liningColors.map((c) => k.rgb(c));
const LINING_EDGE_RGB = k.rgb(IDLE_CAPE.liningEdge);
const LINING_GLOW_RGB = k.rgb(IDLE_CAPE.liningGlow);

// CAPE DISSOLVE SHADER STATE: ONE UNIFORM OBJECT, REFILLED EACH FRAME BY drawCloth() (NO PER-FRAME ALLOCATION).
// BURN-EDGE COLORS ARE THE SPAWN DISSOLVE'S, SO THE TWO EFFECTS MATCH.
let capeDisOn = false;
const capeDisU = {
  u_start: 0, u_amt: 0, u_cell: 1, u_edge: 0.2, u_flow: 0, u_fade: 0, u_glow: 1, u_time: 0, u_len: 1, u_wid: 1,
  u_edgeA: EDGE_INNER_RGB, u_edgeB: EDGE_OUTER_RGB,
};

function drawCloth() {
  if (!clothActive() || cloth.need || cloth.p.length < 3) return;
  if (CAPE_VERLET_SKIP_ANIMS.has(currentAnim)) return; // THOSE SHEETS HAVE THEIR OWN CAPE BAKED IN
  const alpha = FX.dissolve ? 1 - dissolveAmount : 1; // FADE WITH THE BODY'S DISSOLVE
  if (alpha <= 0.02) return;

  const P = cloth.p;
  const r = clothRoot(); // PIN THE HEAD TO *THIS* FRAME'S FINAL COLLAR SO IT NEVER LAGS THE BODY
  P[0].x = r.x;
  P[0].y = r.y;
  if (CLOAK_DEBUG_MARKERS) k.drawCircle({ pos: k.vec2(r.x, r.y), radius: 3, color: k.rgb("#00ffff") });

  capeDisOn = CAPE_DISSOLVE.enabled;
  if (capeDisOn) { // FASTER = THE DISSOLVE CREEPS UP THE CAPE (SAME RULE AS capeLab.html's ghostStart())
    const D = CAPE_DISSOLVE;
    const U = capeDisU;
    U.u_start = Math.max(0, Math.min(0.98, D.start - D.speed * Math.min(1.5, capeSpeed) * 0.5));
    U.u_amt = D.amount;
    U.u_cell = Math.max(2, D.cell);
    U.u_edge = Math.max(0.01, D.edge);
    U.u_flow = D.flow;
    U.u_fade = D.fade;
    U.u_glow = D.glow;
    U.u_time = cloth.t;
    U.u_len = (P.length - 1) * CAPE_CLOTH.segLen;
    U.u_wid = (CAPE_CLOTH.w0 + CAPE_CLOTH.w1) / 2;
  }

  // IDLE IS TWO-LAYERED (SEE IDLE_CAPE): DARK LINING FIRST, SHIFTED TOWARD THE BACK EDGE, THEN THE
  // NARROWER MAIN CAPE ON TOP. layer FADES WITH idleBlend, SO RUN-STYLE CAPE IS THE PLAIN SINGLE RIBBON.
  const layer = IDLE_CAPE.layered ? Math.min(1, idleBlend + attackBlend) : 0; // IDLE AND CAST SHARE THE LINED LOOK
  if (layer > 0.02) {
    drawClothRibbon(P, 1.05, IDLE_CAPE.liningShift, LINING_RGB, LINING_EDGE_RGB, LINING_GLOW_RGB, alpha * layer, false);
  }
  drawClothRibbon(P, 1 + (IDLE_CAPE.topWidth - 1) * layer, 0, CAPE_RGB, CAPE_EDGE_RGB, CAPE_GLOW_RGB, alpha, true);
}

// ONE PASS OF THE RIBBON OVER THE CHAIN. wMul SCALES ITS WIDTH, shift SLIDES IT SIDEWAYS (FRACTION OF ITS
// WIDTH, + = TOWARD THE BACK EDGE), rgb = COLLAR/MIDDLE/HEM COLORS, folds TOGGLES THE FOLD LINES.
function drawClothRibbon(P, wMul, shift, rgb, edgeRgb, glowRgb, alpha, folds) {
  const C = CAPE_CLOTH;
  const n = P.length;
  const dir = player.flipX ? -1 : 1;

  const pts = [];
  const cols = [];
  const uvs = []; // (ACROSS, ALONG) 0..1 PER VERTEX - ONLY THE DISSOLVE SHADER READS THESE
  const left = [];
  const right = [];
  for (let i = 0; i < n; i++) {
    const a = P[Math.max(0, i - 1)];
    const b = P[Math.min(n - 1, i + 1)];
    let tx = b.x - a.x;
    let ty = b.y - a.y;
    const len = Math.hypot(tx, ty) || 1;
    tx /= len;
    ty /= len;
    // SIDE NORMAL, FLIPPED WITH FACING SO THE RIBBON'S "TOP" EDGE IS ALWAYS THE UPPER ONE
    const nx = -ty * dir;
    const ny = tx * dir;
    const s = i / (n - 1);
    let w = C.w0 + (C.w1 - C.w0) * Math.pow(s, 0.8);
    w *= 1 + C.ripple * Math.min(1, capeSpeed + 0.3) * Math.sin(cloth.t * 8 - s * 7) * s;
    const cx = P[i].x + nx * w * shift; // CENTERLINE, SLID SIDEWAYS FOR THE LINING LAYER (shift 0 = ON THE CHAIN)
    const cy = P[i].y + ny * w * shift;
    w *= wMul;
    const L = k.vec2(cx + (nx * w) / 2, cy + (ny * w) / 2);
    const R = k.vec2(cx - (nx * w) / 2, cy - (ny * w) / 2);
    left.push(L);
    right.push(R);
    pts.push(L, R);
    if (capeDisOn) uvs.push(k.vec2(0, s), k.vec2(1, s));
    const c = s < 0.5
      ? rgb[0].lerp(rgb[1], s * 2)
      : rgb[1].lerp(rgb[2], (s - 0.5) * 2);
    cols.push(c, c);
  }
  const indices = [];
  for (let i = 0; i < n - 1; i++) {
    const a = i * 2;
    indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  k.drawPolygon({
    pts, indices, colors: cols, opacity: alpha,
    ...(capeDisOn ? { uv: uvs, shader: "capeDissolve", uniform: capeDisU } : {}),
  });

  // STROKED DETAIL (RIM, GLOW, FOLD LINES). WITH THE DISSOLVE ON THEY'RE DRAWN SEGMENT BY SEGMENT AND FADED
  // OUT PAST THE DISSOLVE START, OTHERWISE THEY'D KEEP OUTLINING CLOTH THE SHADER HAS ALREADY EATEN.
  const fadeAt = (i) => {
    if (!capeDisOn) return 1;
    const x = Math.min(1, Math.max(0, ((i + 0.5) / (n - 1) - capeDisU.u_start) / Math.max(0.001, CAPE_DISSOLVE.edgeFade)));
    return 1 - x * x * (3 - 2 * x);
  };
  const stroke = (line, width, color, opacity) => {
    if (!capeDisOn) { k.drawLines({ pts: line, width, color, opacity }); return; }
    for (let i = 0; i < n - 1; i++) {
      const f = fadeAt(i);
      if (f * opacity > 0.01) k.drawLines({ pts: [line[i], line[i + 1]], width, color, opacity: opacity * f });
    }
  };

  // FOLD LINES + GLOWING HEM EDGES: CHEAP DETAIL THAT SELLS "CLOTH" ON A FLAT FILL
  if (folds) for (const f of [0.33, 0.66]) {
    stroke(left.map((l, i) => l.lerp(right[i], f)), 1.5, edgeRgb, 0.22 * alpha);
  }
  for (const edge of [left, right]) {
    stroke(edge, 7, glowRgb, 0.16 * alpha);
    stroke(edge, 2, edgeRgb, 0.9 * alpha);
  }
  if (!capeDisOn) k.drawLines({ pts: [left[n - 1], right[n - 1]], width: 2.5, color: glowRgb, opacity: 0.9 * alpha }); // HEM CAP - THE DISSOLVE EATS THE HEM
}

/* ---------- DEBUG READOUT ----------
   INDEPENDENT UPDATE LOOP SO IT KEEPS REFRESHING EVEN DURING THE
   isAttacking EARLY-RETURN IN MAIN onUpdate ABOVE. WATCH THE "grounded"
   VALUE: IF IT FLIPS TO false ON JUMP AND NEVER FLIPS BACK TO true AFTER
   LANDING, THAT CONFIRMS isGrounded() IS THE ROOT CAUSE OF THE STUCK ANIMATION. */
k.onUpdate(() => {
  if (!player || !debugLabel) return;
  debugLabel.text =
    `grounded: ${player.isGrounded()}\n` +
    `currentAnim: ${currentAnim}\n` +
    `sheet: ${player.sheet}  frame: ${player.frame}  lift: ${visualLift}  hOffset: ${wallSlideHOffset}\n` +
    `sheet tweak ([ ] = size): scale ${sheetTweak(player.sheet).scale.toFixed(2)}  footGap: ${footGaps[player.sheet]?.[player.frame] ?? "-"}px  idleCape: ${idleBlend.toFixed(2)}\n` +
    `isAttacking: ${isAttacking}\n` +
    `touchingWall: ${touchingWall ? touchingWall.dir : "-"}  wallJumpLock: ${wallJumpLock.toFixed(2)}\n` +
    `vel.y: ${player.vel.y.toFixed(1)}\n` +
    `pos.y: ${player.pos.y.toFixed(1)}\n` +
    `air kick: ${airKick.t > 0 ? airKick.t.toFixed(2) + "s" : airKickReady ? "ready" : "used"}  air jump: ${airJumpReady ? "ready" : "used"}  flip: ${doubleJump.t > 0 ? doubleJump.angle.toFixed(0) + "deg" : "-"}  jumpStart: ${Math.max(0, jumpStartTimer).toFixed(2)}  land: ${Math.max(0, landTimer).toFixed(2)}\n` +
    `squash: ${squash.x.toFixed(2)}, ${squash.y.toFixed(2)}  dash: ${dashTimer > 0 ? "ON" : dashCooldown > 0 ? "cooldown" : "ready"}  dissolve: ${dissolveAmount.toFixed(2)}  light: ${lightingOn ? "on" : "off"}\n` +
    `cape (V): ${CAPE_MODES[capeMode]}  spring: ${capeSpring.a.toFixed(1)}deg  ghost tail (G): ${CAPE_DISSOLVE.enabled ? "on" : "off"}`;
});

/* ---------- BOOT ---------- */
await loadPlayerSprites();
await loadCloakSprites();
await loadSpellSprite(SPELL_SRC);
await loadSwooshSprite(SWOOSH_SRC);
await loadEffectSprites();
await loadLevelSprites();
await loadShaders();
buildLevel();
buildWalls();
spawnPlayer();
k.add([k.z(PARTICLE_Z), { id: "particleLayer", draw: drawParticles }]);
k.add([k.z(GHOST_Z), { id: "ghostLayer", draw: drawGhosts }]);
k.add([k.z(GHOST_Z + 0.5), { id: "clothLayer", draw: drawCloth }]); // verlet cape: behind the body (10), in front of ghosts (9)
k.add([k.z(TORCH_Z), { id: "lampLayer", draw: drawLamps }]); // TORCHES + FLAMES: BEHIND THE PLAYER (10), IN FRONT OF THE LEVEL ART (1-2)
lightOverlay = k.add([
  k.rect(k.width(), k.height()),
  k.pos(0, 0),
  k.fixed(),
  k.z(LIGHTING_Z), // OVER THE WORLD AND PARTICLES, UNDER THE DEBUG READOUT (1000)
  k.shader("lighting", () => lightUniform),
]);
lightOverlay.hidden = !lightingOn;
k.camPos(player.pos.x, player.pos.y - CAM_Y_OFFSET);

debugLabel = k.add([
  k.text("", { size: 12 }),
  k.pos(20, 20),
  k.fixed(),
  k.z(1000),
  k.color(0, 255, 255),
]);
</script>
