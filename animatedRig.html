<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rig Lab — Character Art</title>
<style>
:root{--bg0:#170032;--bg1:#37025a;--vio:#830cde;--lav:#c4b5fd;--cyan:#00ffff;--mag:#dc4ce8;--pink:#ff69b4;--mint:#67FEBD;--panel:rgba(23,0,50,.96)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--lav);font:12px/1.3 Consolas,"Courier New",monospace;overflow:hidden}
canvas{position:fixed;inset:0;display:block}
body.light #hud{color:#37025a;text-shadow:none}
body.light #hud small{color:#5b4b8a}
#bar{position:fixed;top:0;left:0;right:0;height:40px;display:flex;align-items:center;gap:5px;padding:0 5px;background:linear-gradient(#170032,#1d003c);border-bottom:1px solid var(--vio);box-shadow:0 0 14px rgba(131,12,222,.5);z-index:10;overflow-x:auto;white-space:nowrap}
#bar .title{color:var(--cyan);letter-spacing:2px;text-shadow:0 0 8px var(--cyan);margin-right:4px}
.btn,select{background:transparent;border:1px solid var(--vio);color:var(--lav);padding:4px 7px;border-radius:3px;cursor:pointer;font:inherit}
select{background:#170032;padding:4px 6px}
.btn:hover,select:hover,.btn.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 8px rgba(0,255,255,.35)}
.sep{width:1px;height:20px;background:#830cde88}
#scrub{flex:1;min-width:60px;accent-color:#dc4ce8}
#hud{position:fixed;left:14px;bottom:12px;color:var(--mint);text-shadow:0 0 8px rgba(103,254,189,.6);font-size:13px;pointer-events:none;z-index:5}
#hud small{display:block;color:#9090C0;font-size:11px}
.panel{position:fixed;top:41px;width:290px;padding:8px 12px 12px;background:var(--panel);border:1px solid var(--vio);box-shadow:0 0 22px rgba(131,12,222,.5);display:none;z-index:9;max-height:calc(100vh - 60px);overflow:auto}
.panel.open{display:block}
.row{display:grid;grid-template-columns:128px 1fr 42px;gap:6px;align-items:center;margin:5px 0}
.row input[type=range]{width:100%;accent-color:#dc4ce8}
.row input[type=checkbox]{accent-color:#00ffff;justify-self:start}
.row .v{text-align:right;color:var(--mint)}
.head{margin:10px 0 2px;color:var(--pink);font-size:11px;letter-spacing:1px;border-bottom:1px solid #830cde66;padding-bottom:2px}
.note{color:#9090C0;font-size:11px;margin-top:6px}
.panel.wide{width:410px}
.panel.mid{width:330px}
.gridrow{display:grid;grid-template-columns:64px repeat(5,1fr);gap:4px;align-items:center;margin:4px 0;padding:2px 3px;border-radius:3px}
.gridrow.hd span{color:#9090C0;font-size:10px;text-align:center;line-height:1.1}
.gridrow .rl{color:#c4b5fd}
.gridrow.now{background:linear-gradient(90deg,rgba(0,255,255,.18),transparent);box-shadow:inset 2px 0 0 #00ffff}
.gridrow.now .rl{color:#00ffff}
.gridrow input[type=number]{width:100%;min-width:0;background:#170032;border:1px solid #830cde88;color:#c4b5fd;padding:3px 2px;text-align:center;border-radius:3px;font:inherit}
.gridrow input.pos{border-color:#fecd39;color:#fecd39}
.gridrow input.neg{border-color:#ff4a4a;color:#ff9a9e}
.gridbtns{display:flex;gap:6px;margin-top:8px}
.gridbtns .btn{padding:3px 8px;font-size:11px}
.pvrow{display:grid;grid-template-columns:1fr 62px 62px;gap:5px;align-items:center;margin:3px 0;padding:1px 3px;border-radius:3px}
.pvrow .rl{cursor:pointer;color:#c4b5fd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvrow.sel{background:linear-gradient(90deg,rgba(0,255,255,.18),transparent);box-shadow:inset 2px 0 0 #00ffff}
.pvrow.sel .rl{color:#00ffff}
.pvrow input[type=number]{width:100%;min-width:0;background:#170032;border:1px solid #830cde88;color:#c4b5fd;padding:3px 2px;text-align:center;border-radius:3px;font:inherit}
.pvrow input.mod{border-color:#fecd39;color:#fecd39}
.pvrow.hd span{color:#9090C0;font-size:10px;text-align:center}
.pvrow.hd span:first-child{text-align:left}
textarea.pvtxt{width:100%;height:150px;margin-top:8px;background:#170032;color:#67FEBD;border:1px solid #830cde88;border-radius:3px;font:11px/1.35 Consolas,monospace;resize:vertical}
.pvbtns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pvbtns .btn{padding:3px 8px;font-size:11px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="bar">
  <button class="btn" id="play" title="Space">⏸</button>
  <button class="btn" id="prev" title="← previous key pose">⏮</button>
  <button class="btn" id="next" title="→ next key pose">⏭</button>
  <span class="sep"></span>
  <select id="cycle"><option value="run">Run</option><option value="walk">Walk</option></select>
  <select id="speed" title="Speed scale"></select>
  <select id="pose" title="Jump to key pose"></select>
  <input type="range" id="scrub" min="0" max="1000" value="0" title="Scrub cycle">
  <span class="sep"></span>
  <span id="menus" style="display:flex;gap:6px"></span>
  <button class="btn" id="reset">Reset</button>
  <span class="sep"></span>
  <button class="btn" id="cfgExport" title="Download the current slider values, grids and pivots as rig_config.json">⬇ Export</button>
  <button class="btn" id="cfgImport" title="Load a rig_config.json (no server needed)">⬆ Import</button>
  <input type="file" id="cfgFile" accept=".json,application/json" hidden>
</div>
<div id="hud"></div>

function cfgApply(c,startup){

function cfgStringify(v,ind=''){   // pretty JSON, but short leaf objects stay on one line so the file reads like a table
  if(v===null||typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(x=>cfgStringify(x)).join(', ')+']';
  const ks=Object.keys(v); if(!ks.length) return '{}';
  const flat=ks.every(k=>v[k]===null||typeof v[k]!=='object'||(Array.isArray(v[k])&&v[k].every(x=>typeof x!=='object')));
  if(flat){const one='{ '+ks.map(k=>JSON.stringify(k)+': '+cfgStringify(v[k])).join(', ')+' }'; if(one.length+ind.length<=110) return one;}
  return '{\n'+ks.map(k=>ind+'  '+JSON.stringify(k)+': '+cfgStringify(v[k],ind+'  ')).join(',\n')+'\n'+ind+'}';
}

function stretchFor(nm){
  const side=nm.startsWith('left')?'L':'R', opp=side==='L'?'R':'L', t=ptype(nm), g=k=>gv(t,k)/100;
  const z={lL:0,lR:0,aL:0,aR:0,t:g('t')};
  z['l'+side]=g('fl'); z['l'+opp]=g('bl');
  z['a'+opp]=g('fa');  z['a'+side]=g('ba');
  return z;
}
function rebuild(){
  const c=gait.cycles[S.cycle]; order=c.poseOrder;
  const pick=r=>r[0]+(r[1]-r[0])*P.range;
  keys={lT:[],lS:[],rT:[],rS:[],lU:[],lF:[],rU:[],rF:[]};
  stKeys={lL:[],lR:[],aL:[],aR:[],t:[]};
  ftKeys={l:[],r:[]};
  const spd={passing:P.spPassing,takeoff:P.spTakeoff,up:P.spUp,contact:P.spContact,down:P.spDown};
  speeds=[];
  order.forEach(nm=>{
    const p=c.poses[nm];
    keys.lT.push(pick(p.legs.left.thigh));  keys.lS.push(pick(p.legs.left.shin));
    keys.rT.push(pick(p.legs.right.thigh)); keys.rS.push(pick(p.legs.right.shin));
    keys.lU.push(pick(p.arms.left.upperArm));  keys.lF.push(pick(p.arms.left.forearm));
    keys.rU.push(pick(p.arms.right.upperArm)); keys.rF.push(pick(p.arms.right.forearm));
    const z=stretchFor(nm); for(const k in z) stKeys[k].push(z[k]);
    const sd=nm.startsWith('left')?'l':'r', ty=ptype(nm);
    ftKeys.l.push(fv(ty,sd==='l'?'f':'b')); ftKeys.r.push(fv(ty,sd==='r'?'f':'b'));
    speeds.push(spd[ptype(nm)] ?? .5);
  });
}

/* ---------- sampling ---------- */
function hermite(v0,v1,m0,m1,f){const f2=f*f,f3=f2*f;
  return (2*f3-3*f2+1)*v0+(f3-2*f2+f)*m0+(-2*f3+3*f2)*v1+(f3-f2)*m1;}
// Catmull-Rom tangents scaled per key by "pose speed": 1 = whips through, 0 = hangs on the pose
function sampleH(vals,u){
  const n=vals.length, p=(((u%1)+1)%1)*n, i=Math.floor(p), f=p-i;
  const a=i%n,b=(i+1)%n,c=(i+n-1)%n,d=(i+2)%n;
  return hermite(vals[a],vals[b],speeds[a]*(vals[b]-vals[c])/2,speeds[b]*(vals[d]-vals[a])/2,f);
}
function sampleS(vals,u){
  const n=vals.length, p=(((u%1)+1)%1)*n, i=Math.floor(p), f=p-i, s=f*f*(3-2*f);
  return vals[i%n]+(vals[(i+1)%n]-vals[i%n])*s;
}

/* ---------- feet ---------- */
const dirF = deg => [Math.sin(deg*R2D), Math.cos(deg*R2D)];
// foot angle (from vertical-down, +forward; 90 = flat) = 90 - "toes down" degrees, following the shin with extra lag
function footAngleAt(k,u){const lagU=P.footLag/(FPS*P.cycleSec/S.speed);return 90-sampleS(ftKeys[k],u-lagU);}
// the foot is a rigid block: ankle (pivot) -> heel / toe contact corners, with the sole P.soleOff px below the ankle line
function footGeom(ankle,fa){
  const d=dirF(fa), n=[-d[1],d[0]], L=P.footLen, hf=P.heelFrac, base=[ankle[0]+n[0]*P.soleOff,ankle[1]+n[1]*P.soleOff];
  return {heel:[base[0]-d[0]*L*hf,base[1]-d[1]*L*hf], toe:[base[0]+d[0]*L*(1-hf),base[1]+d[1]*L*(1-hf)]};
}
function footDrop(fa){   // how far below the ankle the lowest sole point sits
  const d=dirF(fa), L=P.footLen, hf=P.heelFrac;
  return Math.max(2,P.soleOff*d[0]+Math.max(0,d[1]*L*(1-hf),-d[1]*L*hf));
}

/* ---------- foot height helpers (for the pelvis curve) ---------- */
function legsLow(u){   // how far below the pelvis the lowest foot point is, at phase u
  const L=bones.bones, lagU=P.lag/(FPS*P.cycleSec/S.speed);
  let low=-1e9;
  for(const k of ['l','r']){
    const sc=1+P.ssAmt*sampleS(stKeys[k==='l'?'lL':'lR'],u);
    const tA=sampleH(keys[k+'T'],u), sA=sampleH(keys[k+'S'],u-lagU);
    const ay=L.thigh.length*sc*Math.cos(tA*R2D)+L.shin.length*sc*Math.cos(sA*R2D);
    const fa=footAngleAt(k,u);
    low=Math.max(low,ay+footDrop(fa));
  }
  return low;
}
function stanceH(){    // base pelvis height = average foot-drop across the grounded key poses
  const n=order.length; let sum=0,cnt=0;
  order.forEach((nm,i)=>{const t=ptype(nm);if(t==='passing'||t==='contact'||t==='down'){sum+=legsLow(i/n);cnt++;}});
  return cnt?sum/cnt:300;
}

/* ---------- the rig solve ---------- */
const dirV = deg => [Math.sin(deg*R2D), Math.cos(deg*R2D)];   // from vertical-down, +forward
const add=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k];

function solve(u){
  const L=bones.bones, Tm=bones.torso, cy=CYC[S.cycle];
  const lagU = P.lag/(FPS*P.cycleSec/S.speed);
  const tw = Math.sin(2*Math.PI*(u+cy.twistPh));                 // +1: right shoulder fwd / left hip fwd
  const lc = .5-.5*Math.cos(4*Math.PI*(u-cy.liftPh));            // 0..1, peaks at the "up" poses
  const a=P.ssAmt;
  const sc={lL:1+a*sampleS(stKeys.lL,u), lR:1+a*sampleS(stKeys.lR,u),
            aL:1+a*sampleS(stKeys.aL,u), aR:1+a*sampleS(stKeys.aR,u), t:1+a*sampleS(stKeys.t,u)};
  const guides=[];
  const limb=(root,aA,lA,aB,lB)=>{
    const mid=add(root,dirV(aA),lA), end=add(mid,dirV(aB),lB);
    guides.push({c:root,r:lA},{c:mid,r:lB});
    return [mid,end];
  };
  /* legs — hips sit at the pelvis, nudged by hip twist */
  const pelvis=[0,0];
  const hipL=[ P.hipTwist*tw,0], hipR=[-P.hipTwist*tw,0];
  const legs={};
  const isRun=S.cycle==='run';
  const hRun=isRun?stanceH()+P.airtime*Math.pow(lc,2.5):0;   // designed pelvis bounce: peaks at "up"
  for(const [s,hip,sk] of [['L',hipL,'l'],['R',hipR,'r']]){
    const k=sk, tA=sampleH(keys[k+'T'],u), sA=sampleH(keys[k+'S'],u-lagU);
    const fa=footAngleAt(k,u);
    let legSc=sc['l'+s];
    if(isRun){
      /* foot plant: a leg that is near the ground stretches/compresses (max ±12%) so its foot meets the floor
         at the bounce height; legs in the air are left alone */
      const ay=L.thigh.length*Math.cos(tA*R2D)+L.shin.length*Math.cos(sA*R2D);
      const ft=footDrop(fa);
      const f=Math.max(.88,Math.min(1.12,(hRun-ft)/(ay*legSc)));
      const t=Math.max(0,Math.min(1,(ay*legSc+ft-(hRun-70))/50));
      legSc*=1+(f-1)*t*t*(3-2*t);
    }
    const [knee,ankle]=limb(hip,tA,L.thigh.length*legSc,sA,L.shin.length*legSc);
    {const fg=footGeom(ankle,fa);legs[s]={hip,knee,ankle,heel:fg.heel,toe:fg.toe,drop:footDrop(fa),fa};}
  }
  /* torso */
  const sp=[Math.cos(P.spineAngle*R2D),-Math.sin(P.spineAngle*R2D)];
  const ch=[Math.cos(P.chestAngle*R2D),-Math.sin(P.chestAngle*R2D)];
  const nrm=[Math.sin(P.chestAngle*R2D),Math.cos(P.chestAngle*R2D)];   // chest-front normal
  const rib=add(pelvis,sp,Tm.chestToPelvis*sc.t);
  const shTop=add(rib,ch,Tm.neckToChest*sc.t);
  const rect=[add(rib,nrm,-P.chestDepth/2),add(rib,nrm,P.chestDepth/2),
              add(shTop,nrm,P.chestDepth/2),add(shTop,nrm,-P.chestDepth/2)];
  const shC=add(shTop,ch,-12);
  const shNear=add(shC,nrm,tw*P.twist), shFar=add(shC,nrm,-tw*P.twist);
  /* arms: right = near, left = far */
  const arms={};
  for(const [s,root,sk] of [['L',shFar,'l'],['R',shNear,'r']]){
    const [elbow,wrist]=limb(root,sampleH(keys[sk+'U'],u),L.upperArm.length*sc['a'+s],
                                  sampleH(keys[sk+'F'],u-lagU),L.forearm.length*sc['a'+s]);
    arms[s]={root,elbow,wrist};
  }
  /* neck + head */
  const nd=[Math.sin(P.neckAngle*R2D),-Math.cos(P.neckAngle*R2D)];
  const off=[P.headJut*lc,-P.headBob*lc];
  const head=add(add(add(shTop,nd,P.neckLen+P.headR),off),[0,0]);
  const neckEnd=add(head,nd,-P.headR);
  /* pelvis height. Run: the designed bounce above (no sinking at "up"). Walk: lowest foot locked to y=0. */
  const low=Math.max(legs.L.ankle[1]+legs.L.drop,legs.R.ankle[1]+legs.R.drop);
  const h=isRun?hRun:low;
  const oy=-h;
  return {pelvis,legs,rib,shTop,rect,shNear,shFar,arms,head,neckEnd,guides,oy,lc,ss:sc};
}

const COL={near:'#00ffff',far:'#dc4ce8',torso:'#A55AFF',head:'#ff69b4',joint:'#FFC7FF',pelvis:'#67FEBD',bg:'#170032'};
const COL_DARK=Object.assign({},COL), COL_LIGHT={near:'#0092b3',far:'#b21fc2',torso:'#7a2fe0',head:'#d6307f',joint:'#37025a',pelvis:'#17a673',bg:'#DBE2E9'};   // neon colours darkened to read on the light stage
function mix(a,b,t){   // blend two #rrggbb colors
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const c=i=>Math.round(((pa>>i)&255)*(1-t)+((pb>>i)&255)*t);
  return '#'+[16,8,0].map(i=>c(i).toString(16).padStart(2,'0')).join('');
}
function seg(a,b,col,w,glow=10){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.shadowColor=col;ctx.shadowBlur=glow;
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.shadowBlur=0;
}

  ctx.lineWidth=2;ctx.strokeStyle=col;ctx.stroke();
}

  if(P.footLen>0){   // foot wedge: ankle (pivot) -> heel -> toe
    ctx.beginPath();ctx.moveTo(l.ankle[0],l.ankle[1]);ctx.lineTo(l.heel[0],l.heel[1]);ctx.lineTo(l.toe[0],l.toe[1]);ctx.closePath();
    ctx.globalAlpha=.2;ctx.fillStyle=col;ctx.fill();ctx.globalAlpha=1;
    ctx.lineWidth=P.lineW*.55;ctx.lineJoin='round';ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;
  }
  if(P.joints){dot(l.knee,7,COL.joint);dot(l.ankle,6,COL.joint);
    if(P.footLen>0){dot(l.heel,3,COL.joint);dot(l.toe,3,COL.joint);}}
}

  const tp=ptype(order[k]);
  if(tp!==lastType){for(const n in gridUI)for(const t in gridUI[n].rows)gridUI[n].rows[t].classList.toggle('now',t===tp);lastType=tp;}
  hud.lastChild.textContent=`phase ${u.toFixed(3)}  •  ${(P.cycleSec/S.speed).toFixed(2)}s cycle  •  data: ${dataSrc}  •  art: ${artLabel}`;
  if(!scrubbing) scrub.value=Math.round(u*1000);
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const hud=$('hud'), scrub=$('scrub'), playBtn=$('play');
hud.append(document.createTextNode(''),document.createElement('small'));
let scrubbing=false;

function updatePlay(){playBtn.textContent=S.playing?'⏸':'▶';playBtn.classList.toggle('on',!S.playing);}
function togglePlay(){S.playing=!S.playing;updatePlay();}
function stepPose(d){
  const n=order.length,u=((S.T%1)+1)%1,k=Math.round(u*n);
  S.T=Math.floor(S.T)+(k+d)/n;S.playing=false;updatePlay();
}
playBtn.onclick=e=>{togglePlay();e.target.blur();};
$('prev').onclick=e=>{stepPose(-1);e.target.blur();};
$('next').onclick=e=>{stepPose(1);e.target.blur();};
scrub.addEventListener('pointerdown',()=>{scrubbing=true;});
addEventListener('pointerup',()=>{scrubbing=false;});
scrub.addEventListener('input',()=>{S.T=Math.floor(S.T)+scrub.value/1000;S.playing=false;updatePlay();});
$('pose').onchange=e=>{const n=order.length;S.T=Math.floor(S.T)+(+e.target.value)/n;S.playing=false;updatePlay();e.target.blur();};
$('speed').onchange=e=>{S.speed=+e.target.value;e.target.blur();};
$('cycle').onchange=e=>{setCycle(e.target.value);e.target.blur();};
$('reset').onclick=e=>{for(const k in CYC_LIVE)delete CYC_LIVE[k];Object.assign(P,BASE,CYCLE_DEFAULTS[S.cycle]);rebuildTints();resetGrids();resetFootGrids();rebuild();renderGrids();syncAll();e.target.blur();};
$('cfgExport').onclick=e=>{cfgDownload(e.target);e.target.blur();};
$('cfgImport').onclick=e=>{$('cfgFile').click();e.target.blur();};
$('cfgFile').onchange=e=>{const f=e.target.files[0];if(f)cfgImport(f,$('cfgImport'));e.target.value='';};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(S.edit&&E.sel&&e.code.startsWith('Arrow')){e.preventDefault();
    const st=e.shiftKey?2:(e.altKey?.1:.5), dx=e.code==='ArrowLeft'?-st:e.code==='ArrowRight'?st:0, dy=e.code==='ArrowUp'?-st:e.code==='ArrowDown'?st:0;
    pivSet(E.sel,ART_PIV[E.sel][0]+dx,ART_PIV[E.sel][1]+dy);pivSave();return;}
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.code==='ArrowRight'){stepPose(1);}
  else if(e.code==='ArrowLeft'){stepPose(-1);}
});

const MENUS={

  {k:'spPassing',l:'Passing',min:0,max:1.2,step:.05},
  {k:'spTakeoff',l:'Takeoff',min:0,max:1.2,step:.05},

const panels={}, syncers=[];
function buildMenus(){
  const host=$('menus');
  for(const name in MENUS){
    const btn=document.createElement('button');btn.className='btn menubtn';btn.textContent=name+' ▾';
    const pn=document.createElement('div');pn.className='panel';panels[name]=pn;
    if(name==='Squash/Stretch'||name==='Feet'||name==='Pivots'){pn.classList.add(name==='Squash/Stretch'?'wide':'mid');pn.dataset.right='1';}
    MENUS[name].forEach(it=>addRow(pn,it));
    btn.onclick=e=>{
      e.stopPropagation();
      for(const k in panels){
        if(k===name){const open=!pn.classList.contains('open');pn.classList.toggle('open',open);
          if(open){const rc=btn.getBoundingClientRect();pn.style.left=(pn.dataset.right?innerWidth-pn.offsetWidth-8:Math.max(6,Math.min(rc.left,innerWidth-pn.offsetWidth-8)))+'px';}}
        else panels[k].classList.remove('open');
      }
    };
    host.appendChild(btn);document.body.appendChild(pn);
  }
  document.addEventListener('click',e=>{if(!e.target.closest('.panel')&&!(S.edit&&e.target===cv))for(const k in panels)panels[k].classList.remove('open');});
}
function addRow(pn,it){
  if(it.pivots){buildPivotPanel(pn);return;}
  if(it.head){const h=document.createElement('div');h.className='head';h.textContent=it.head;pn.appendChild(h);return;}
  if(it.grid){const h=document.createElement('div');pn.appendChild(h);gridUI[it.grid]={host:h,rows:{}};return;}
  if(it.note){const d=document.createElement('div');d.className='note';d.textContent=it.note;pn.appendChild(d);return;}
  const row=document.createElement('div');row.className='row';
  const lab=document.createElement('span');lab.textContent=it.l;
  const val=document.createElement('span');val.className='v';
  const inp=document.createElement('input');
  if(it.color){
    inp.type='color';inp.style.cssText='width:100%;height:20px;padding:0;border:1px solid #830cde88;background:none';
    inp.oninput=()=>{P[it.k]=inp.value;val.textContent=inp.value.slice(1);};
    syncers.push(()=>{inp.value=P[it.k];val.textContent=String(P[it.k]).slice(1);});
  }else if(it.check){
    inp.type='checkbox';
    inp.onchange=()=>{P[it.k]=inp.checked;if(it.on)it.on();};
    syncers.push(()=>{inp.checked=!!P[it.k];});
  }else{
    inp.type='range';inp.min=it.min;inp.max=it.max;inp.step=it.step;
    const dec=it.step>=1?0:(String(it.step).split('.')[1]||'').length;
    inp.oninput=()=>{P[it.k]=+inp.value;val.textContent=(+inp.value).toFixed(dec);rebuild();if(it.on)it.on();};
    syncers.push(()=>{inp.value=P[it.k];val.textContent=(+P[it.k]).toFixed(dec);});
  }
  row.append(lab,inp,val);pn.appendChild(row);
}
function syncAll(){syncers.forEach(f=>f());}

/* ---------- editable grids (squash/stretch, feet) ---------- */
const GRIDDEFS={
  ss:  {parts:GRID_PARTS, min:-30, max:30,  step:.5, unit:'%', get:()=>GRIDS[S.cycle],  set:o=>{GRIDS[S.cycle]=o},  def:()=>GRID_DEFAULT[S.cycle]},
  foot:{parts:FOOT_PARTS, min:-45, max:135, step:1,  unit:'°', get:()=>FGRIDS[footMode()][S.cycle], set:o=>{FGRIDS[footMode()][S.cycle]=o}, def:()=>FOOT_DEFAULT[footMode()][S.cycle]}
};
const gridUI={};
function paintCell(inp){const v=parseFloat(inp.value)||0;inp.classList.toggle('pos',v>0);inp.classList.toggle('neg',v<0);}
function renderGrid(name){
  const ui=gridUI[name]; if(!ui) return;
  const D=GRIDDEFS[name], G=D.get(), types=[...new Set(order.map(ptype))], cols=`64px repeat(${D.parts.length},1fr)`;
  ui.host.innerHTML='';ui.rows={};
  const hd=document.createElement('div');hd.className='gridrow hd';hd.style.gridTemplateColumns=cols;
  hd.appendChild(document.createElement('span'));
  D.parts.forEach(([,lbl])=>{const sp=document.createElement('span');sp.textContent=lbl;hd.appendChild(sp);});
  ui.host.appendChild(hd);
  types.forEach(t=>{
    G[t]=G[t]||{};
    const row=document.createElement('div');row.className='gridrow';row.style.gridTemplateColumns=cols;
    const rl=document.createElement('span');rl.className='rl';rl.textContent=t[0].toUpperCase()+t.slice(1);row.appendChild(rl);
    D.parts.forEach(([pk,lbl])=>{
      const inp=document.createElement('input');inp.type='number';inp.min=D.min;inp.max=D.max;inp.step=D.step;
      inp.title=`${rl.textContent} · ${lbl} (${D.unit})`;inp.value=G[t][pk]||0;paintCell(inp);
      inp.oninput=()=>{G[t][pk]=parseFloat(inp.value)||0;paintCell(inp);rebuild();};
      row.appendChild(inp);
    });
    ui.rows[t]=row;ui.host.appendChild(row);
  });
  const bt=document.createElement('div');bt.className='gridbtns';
  const mk=(txt,fn)=>{const bb=document.createElement('button');bb.className='btn';bb.textContent=txt;bb.onclick=e=>{fn();e.target.blur();};bt.appendChild(bb);};
  mk('Zero all',()=>{D.set({});renderGrid(name);rebuild();});
  mk('Defaults',()=>{D.set(JSON.parse(JSON.stringify(D.def())));renderGrid(name);rebuild();});
  ui.host.appendChild(bt);
}
function renderGrids(){lastType='';for(const n in gridUI)renderGrid(n);}

function applyFootMode(){Object.assign(P,P.bootOn?FOOT_PRESET.boot:FOOT_PRESET.bare);rebuild();renderGrids();syncAll();}

function setCycle(c){
  cfgStash();
  S.cycle=c;$('cycle').value=c;
  Object.assign(P,CYC_LIVE[c]||CYCLE_DEFAULTS[c]);
  const sp=$('speed');sp.innerHTML='';
  const ss=gait.cycles[c].speedScale||{default:1};
  for(const k in ss){const o=document.createElement('option');o.value=ss[k];o.textContent=`${k} ×${ss[k]}`;if(k==='default')o.selected=true;sp.appendChild(o);}
  S.speed=+(ss.default??1);
  rebuild();
  const pj=$('pose');pj.innerHTML='';
  order.forEach((nm,i)=>{const o=document.createElement('option');o.value=i;o.textContent=nm;pj.appendChild(o);});
  renderGrids();
  syncAll();
}

/* ---------- boot ---------- */
(async function(){
  await loadData();
  applyArtBones();
  Object.assign(P,BASE);
  await loadArt();
  loadGhost();
  resetGrids();resetFootGrids();
  buildMenus();
  resize();
  setCycle('run');
  pivSyncUI();
  updatePlay();
  let last=performance.now();
  (function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(S.playing) S.T+=dt*S.speed/P.cycleSec;
    render();requestAnimationFrame(frame);
  })(last);
})();
</script>
